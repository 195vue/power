<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合约管理 - 新能源电力交易辅助决策系统</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">合约管理</h2>
            <p class="page-subtitle">维护中长期交易合约数据，支撑交易策略分析与辅助决策</p>
        </div>

        <div class="filter-bar">
            <div class="filter-item">
                <label>交易品类</label>
                <select class="filter-select" style="width:160px" id="contract-filter-type">
                    <option value="all">全部品类</option>
                    <option>年度双边协商合约</option>
                    <option>月度集中竞价合约</option>
                    <option>月度双边协商合约</option>
                    <option>季度双边协商合约</option>
                    <option>年度集中竞价合约</option>
                    <option>现货</option>
                </select>
            </div>
            <div class="filter-item">
                <label>年份</label>
                <select class="filter-select" style="width:100px" id="contract-filter-year">
                    <option value="all">全部年份</option>
                    <option>2025</option>
                    <option>2026</option>
                </select>
            </div>
            <div class="filter-item">
                <label>所属公司</label>
                <select class="filter-select" style="width:140px" id="contract-filter-company">
                    <option value="all">全部公司</option>
                    <option>新能源公司</option>
                    <option>传统能源公司</option>
                    <option>独立售电公司</option>
                </select>
            </div>
            <button class="btn-primary" onclick="filterContracts()">查询</button>
            <div style="flex:1"></div>
            <button class="btn-default" onclick="downloadContractTemplate()">下载导入模板</button>
            <button class="btn-default" onclick="openContractImportModal()">批量导入</button>
            <button class="btn-primary" onclick="openContractModal()">+ 新增合约</button>
        </div>

        <div class="table-section" style="margin-top: var(--space-4)">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>合约名称</th>
                        <th>交易品类</th>
                        <th>交易时段</th>
                        <th>电量占比(%)</th>
                        <th>电价(元/MWh)</th>
                        <th>年度</th>
                        <th>所属公司</th>
                        <th>关联场站</th>
                        <th style="width:140px">操作</th>
                    </tr>
                </thead>
                <tbody id="contract-table-body"></tbody>
            </table>
            <div class="pagination">
                <span class="info-text" id="contract-count">共 0 条记录</span>
                <div>
                    <button class="page-btn active">1</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 导入弹窗 -->
    <div class="modal-overlay" id="contract-import-modal" style="display:none">
        <div class="modal-panel" style="width:720px">
            <div class="modal-header">
                <h3>批量导入合约数据</h3>
                <button class="modal-close" onclick="closeContractImportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="padding:var(--space-3);background:var(--bg-secondary);border-radius:var(--radius);margin-bottom:var(--space-4)">
                    <strong>导入流程：</strong>
                    <div style="display:flex;gap:var(--space-4);margin-top:8px">
                        <div style="display:flex;align-items:center;gap:8px">
                            <span style="width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px">1</span>
                            <span style="font-size:var(--text-sm)">上传文件</span>
                        </div>
                        <div style="color:var(--border)">→</div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <span style="width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:12px">2</span>
                            <span style="font-size:var(--text-sm)">解析预览</span>
                        </div>
                        <div style="color:var(--border)">→</div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <span style="width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:12px">3</span>
                            <span style="font-size:var(--text-sm)">确认导入</span>
                        </div>
                    </div>
                </div>
                <div class="import-drop-area" onclick="document.getElementById('contract-import-file').click()" style="border:2px dashed var(--border);border-radius:var(--radius);padding:var(--space-6);text-align:center;cursor:pointer;margin-bottom:var(--space-4);background:var(--bg-secondary)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;margin:0 auto var(--space-3);color:var(--muted)">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <div style="font-size:var(--text-sm);color:var(--muted)">点击或拖拽文件到此处上传</div>
                    <input type="file" id="contract-import-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleContractImport(this)">
                </div>
                <div style="margin-bottom:var(--space-3)">
                    <h4 style="margin:0 0 var(--space-2);font-size:var(--text-sm);font-weight:600">已上传文件列表</h4>
                    <table class="data-table" style="font-size:var(--text-xs)">
                        <thead>
                            <tr>
                                <th style="width:200px">文件名</th>
                                <th style="width:120px">上传时间</th>
                                <th style="width:80px">上传人</th>
                                <th style="width:80px">数据条数</th>
                                <th style="width:100px">状态</th>
                                <th style="width:120px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="contract-import-file-list"></tbody>
                    </table>
                    <div id="contract-import-file-empty" style="text-align:center;color:var(--muted);padding:var(--space-4);display:none">暂无上传文件</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-default" onclick="downloadContractTemplate()">下载模板</button>
                <button class="btn-primary" onclick="document.getElementById('contract-import-file').click()">选择文件上传</button>
            </div>
        </div>
    </div>

    <!-- 预览弹窗 -->
    <div class="modal-overlay" id="contract-preview-modal" style="display:none">
        <div class="modal-panel" style="width:800px">
            <div class="modal-header">
                <h3>数据预览</h3>
                <button class="modal-close" onclick="closeContractPreviewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="padding:var(--space-2);background:var(--bg-secondary);border-radius:var(--radius);margin-bottom:var(--space-3);font-size:var(--text-sm)">
                    <strong>文件：</strong><span id="contract-preview-filename"></span>
                    <span style="margin-left:var(--space-4)"><strong>总条数：</strong><span id="contract-preview-total"></span></span>
                    <span style="margin-left:var(--space-4)"><strong>有效条数：</strong><span id="contract-preview-valid"></span></span>
                    <span style="margin-left:var(--space-4)"><strong>无效条数：</strong><span id="contract-preview-invalid"></span></span>
                </div>
                <div style="max-height:350px;overflow-y:auto">
                    <table class="data-table" style="font-size:var(--text-xs)">
                        <thead id="contract-preview-thead"></thead>
                        <tbody id="contract-preview-tbody"></tbody>
                    </table>
                </div>
                <div id="contract-preview-errors" style="margin-top:var(--space-3);max-height:150px;overflow-y:auto;display:none"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-default" onclick="closeContractPreviewModal()">取消</button>
                <button class="btn-primary" onclick="confirmContractImport()">确认导入</button>
            </div>
        </div>
    </div>

    <!-- 合约弹窗 -->
    <div class="modal-overlay" id="contract-modal" style="display:none">
        <div class="modal-panel" style="width:600px">
            <div class="modal-header">
                <h3 id="contract-modal-title">新增合约</h3>
                <button class="modal-close" onclick="closeContractModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">合约名称 <span style="color:var(--danger)">*</span></label>
                        <input class="form-input" id="contract-name" placeholder="请输入合约名称">
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">交易品类 <span style="color:var(--danger)">*</span></label>
                        <select class="form-input" id="contract-type">
                            <option>年度双边协商合约</option>
                            <option>月度集中竞价合约</option>
                            <option>月度双边协商合约</option>
                            <option>季度双边协商合约</option>
                            <option>年度集中竞价合约</option>
                            <option>现货</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">交易时段 <span style="color:var(--danger)">*</span></label>
                        <input class="form-input" id="contract-period" placeholder="如：2025年1-9月">
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">年度 <span style="color:var(--danger)">*</span></label>
                        <select class="form-input" id="contract-year">
                            <option>2025</option>
                            <option>2026</option>
                            <option>2027</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">电量占比(%)</label>
                        <input class="form-input" id="contract-share" type="number" step="0.1" placeholder="如：40">
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">电价(元/MWh)</label>
                        <input class="form-input" id="contract-price" type="number" step="0.01" placeholder="如：450">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">所属公司</label>
                        <select class="form-input" id="contract-company">
                            <option>新能源公司</option>
                            <option>传统能源公司</option>
                            <option>独立售电公司</option>
                        </select>
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">关联场站</label>
                        <input class="form-input" id="contract-station" placeholder="多个场站用逗号分隔">
                    </div>
                </div>
                <div class="form-section">
                    <label class="form-label">备注说明</label>
                    <textarea class="form-input" id="contract-notes" rows="2" placeholder="合约说明、特殊条款等" style="resize:vertical;min-height:48px"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeContractModal()">取消</button>
                <button class="btn-primary" onclick="saveContract()">保存</button>
            </div>
        </div>
    </div>

    <script>
        var contractData = [
            { name: '桂阳月和2025年度双边协商合约', type: '年度双边协商合约', period: '2025年1-12月', share: 40, price: 450, year: '2025', company: '新能源公司', station: '桂阳月和风电场', notes: '年度固定电价合约' },
            { name: '桂阳月和2025月度集中竞价合约', type: '月度集中竞价合约', period: '2025年1-9月', share: 60, price: 0, year: '2025', company: '新能源公司', station: '桂阳月和风电场', notes: '按月度交易均价执行' },
            { name: '桂阳月和2025Q4月度集中竞价合约', type: '月度集中竞价合约', period: '2025年10-12月', share: 50, price: 0, year: '2025', company: '新能源公司', station: '桂阳月和风电场', notes: '四季度调整后比例' },
            { name: '桂阳月和2025Q4现货合约', type: '现货', period: '2025年10-12月', share: 10, price: 0, year: '2025', company: '新能源公司', station: '桂阳月和风电场', notes: '按实时出清价格执行' },
            { name: '光伏电站A2025年度合约', type: '年度双边协商合约', period: '2025年1-12月', share: 50, price: 452, year: '2025', company: '新能源公司', station: '光伏电站A', notes: '年度固定电价' },
            { name: '光伏电站A2025月度竞价合约', type: '月度集中竞价合约', period: '2025年1-12月', share: 50, price: 0, year: '2025', company: '新能源公司', station: '光伏电站A', notes: '按月度均价执行' },
            { name: '风电场B2026年度合约', type: '年度双边协商合约', period: '2026年1-12月', share: 45, price: 430, year: '2026', company: '新能源公司', station: '风电场B', notes: '2026年新签合约' },
            { name: '风电场B2026月度竞价合约', type: '月度集中竞价合约', period: '2026年1-12月', share: 55, price: 0, year: '2026', company: '新能源公司', station: '风电场B', notes: '按月度均价执行' }
        ];
        var contractEditIndex = -1;
        var contractImportFiles = [];
        var currentContractPreviewData = [];
        var currentContractPreviewFile = null;

        function renderContracts(list) {
            var data = list || contractData;
            var tbody = document.getElementById('contract-table-body');
            tbody.innerHTML = '';
            data.forEach(function(c, i) {
                var priceDisplay = c.price > 0 ? c.price : '按交易均价';
                tbody.innerHTML += '<tr>' +
                    '<td><strong>' + c.name + '</strong></td>' +
                    '<td><span style="display:inline-block;padding:2px 8px;border-radius:var(--radius-pill);font-size:11px;background:color-mix(in oklab, var(--accent), transparent 90%);color:var(--accent)">' + c.type + '</span></td>' +
                    '<td>' + c.period + '</td>' +
                    '<td style="text-align:right;font-weight:600">' + c.share + '%</td>' +
                    '<td style="text-align:right">' + priceDisplay + '</td>' +
                    '<td>' + c.year + '年</td>' +
                    '<td>' + c.company + '</td>' +
                    '<td>' + c.station + '</td>' +
                    '<td style="white-space:nowrap">' +
                    '<button class="btn-config" onclick="openContractModal(' + i + ')" style="padding:var(--space-1) var(--space-3);font-size:var(--text-xs)">编辑</button> ' +
                    '<button class="btn-delete" onclick="deleteContract(' + i + ')" style="padding:var(--space-1) var(--space-3);font-size:var(--text-xs)">删除</button>' +
                    '</td></tr>';
            });
            document.getElementById('contract-count').textContent = '共 ' + data.length + ' 条记录';
        }

        function openContractModal(index) {
            var modal = document.getElementById('contract-modal');
            if (index === undefined || index === null || index === -1) {
                contractEditIndex = -1;
                document.getElementById('contract-modal-title').textContent = '新增合约';
                ['contract-name','contract-period','contract-share','contract-price','contract-station','contract-notes'].forEach(function(id) {
                    document.getElementById(id).value = '';
                });
                document.getElementById('contract-type').value = '年度双边协商合约';
                document.getElementById('contract-year').value = '2025';
                document.getElementById('contract-company').value = '新能源公司';
            } else {
                contractEditIndex = index;
                document.getElementById('contract-modal-title').textContent = '编辑合约';
                var c = contractData[index];
                document.getElementById('contract-name').value = c.name;
                document.getElementById('contract-type').value = c.type;
                document.getElementById('contract-period').value = c.period;
                document.getElementById('contract-year').value = c.year;
                document.getElementById('contract-share').value = c.share;
                document.getElementById('contract-price').value = c.price;
                document.getElementById('contract-company').value = c.company;
                document.getElementById('contract-station').value = c.station;
                document.getElementById('contract-notes').value = c.notes || '';
            }
            modal.style.display = 'flex';
        }

        function closeContractModal() {
            document.getElementById('contract-modal').style.display = 'none';
        }

        function saveContract() {
            var data = {
                name: document.getElementById('contract-name').value,
                type: document.getElementById('contract-type').value,
                period: document.getElementById('contract-period').value,
                year: document.getElementById('contract-year').value,
                share: parseFloat(document.getElementById('contract-share').value) || 0,
                price: parseFloat(document.getElementById('contract-price').value) || 0,
                company: document.getElementById('contract-company').value,
                station: document.getElementById('contract-station').value,
                notes: document.getElementById('contract-notes').value
            };
            if (!data.name) { alert('请输入合约名称'); return; }
            if (!data.period) { alert('请输入交易时段'); return; }
            if (contractEditIndex === -1) {
                contractData.push(data);
            } else {
                contractData[contractEditIndex] = data;
            }
            renderContracts();
            closeContractModal();
        }

        function deleteContract(index) {
            if (confirm('确认删除合约「' + contractData[index].name + '」？')) {
                contractData.splice(index, 1);
                renderContracts();
            }
        }

        function filterContracts() {
            var type = document.getElementById('contract-filter-type').value;
            var year = document.getElementById('contract-filter-year').value;
            var company = document.getElementById('contract-filter-company').value;
            var filtered = contractData.filter(function(c) {
                if (type !== 'all' && c.type !== type) return false;
                if (year !== 'all' && c.year !== year) return false;
                if (company !== 'all' && c.company !== company) return false;
                return true;
            });
            renderContracts(filtered);
        }

        function downloadContractTemplate() {
            var headers = ['合约名称', '交易品类', '交易时段', '电量占比(%)', '电价(元/MWh)', '年度', '所属公司', '关联场站', '备注说明'];
            var csvContent = '\uFEFF' + headers.join(',') + '\n';
            csvContent += '桂阳月和2025年度双边协商合约,年度双边协商合约,2025年1-12月,40,450,2025,新能源公司,桂阳月和风电场,年度固定电价合约\n';
            
            var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '合约数据导入模板.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function openContractImportModal() {
            document.getElementById('contract-import-modal').style.display = 'flex';
            document.getElementById('contract-import-file').value = '';
            renderContractImportFileList();
        }

        function closeContractImportModal() {
            document.getElementById('contract-import-modal').style.display = 'none';
        }

        function renderContractImportFileList() {
            var tbody = document.getElementById('contract-import-file-list');
            var empty = document.getElementById('contract-import-file-empty');
            
            if (contractImportFiles.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            tbody.innerHTML = '';
            
            contractImportFiles.forEach(function(f, idx) {
                var statusText = f.status === '待解析' ? '<span class="badge badge-muted">待解析</span>' :
                                 f.status === '已解析' ? '<span class="badge badge-success">已解析</span>' :
                                 f.status === '已导入' ? '<span class="tag status-success">已导入</span>' :
                                 '<span class="tag status-danger">导入失败</span>';
                
                var actions = '';
                if (f.status === '待解析') {
                    actions = '<button class="btn-default" onclick="parseContractPreview(' + idx + ')" style="padding:2px 8px;font-size:12px">解析预览</button> ' +
                              '<button class="btn-delete" onclick="deleteContractImportFile(' + idx + ')" style="padding:2px 8px;font-size:12px">删除</button>';
                } else if (f.status === '已解析') {
                    actions = '<button class="btn-primary" onclick="parseContractPreview(' + idx + ')" style="padding:2px 8px;font-size:12px">确认导入</button> ' +
                              '<button class="btn-delete" onclick="deleteContractImportFile(' + idx + ')" style="padding:2px 8px;font-size:12px">删除</button>';
                } else {
                    actions = '<button class="btn-default" onclick="parseContractPreview(' + idx + ')" style="padding:2px 8px;font-size:12px">查看</button>';
                }
                
                tbody.innerHTML += '<tr>' +
                    '<td><strong>' + f.name + '</strong></td>' +
                    '<td>' + f.uploadTime + '</td>' +
                    '<td>' + f.uploader + '</td>' +
                    '<td>' + (f.rowCount || '-') + '</td>' +
                    '<td>' + statusText + '</td>' +
                    '<td>' + actions + '</td>' +
                    '</tr>';
            });
        }

        function handleContractImport(input) {
            var file = input.files[0];
            if (!file) return;

            var ext = file.name.split('.').pop().toLowerCase();
            if (!['xlsx', 'xls', 'csv'].includes(ext)) {
                alert('仅支持 Excel (.xlsx/.xls) 和 CSV 格式文件');
                return;
            }

            var now = new Date();
            var fileRecord = {
                id: Date.now(),
                name: file.name,
                file: file,
                uploadTime: now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + 
                         String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
                uploader: '管理员',
                status: '待解析',
                rowCount: null,
                validCount: 0,
                invalidCount: 0,
                errors: [],
                parsedData: null
            };

            contractImportFiles.unshift(fileRecord);
            renderContractImportFileList();
            input.value = '';
        }

        function deleteContractImportFile(index) {
            if (confirm('确认删除文件「' + contractImportFiles[index].name + '」？')) {
                contractImportFiles.splice(index, 1);
                renderContractImportFileList();
            }
        }

        function parseContractPreview(index) {
            var fileRecord = contractImportFiles[index];
            currentContractPreviewFile = fileRecord;
            
            document.getElementById('contract-preview-filename').textContent = fileRecord.name;
            
            setTimeout(function() {
                var mockData = [
                    { name: '风电场C2025年度合约', type: '年度双边协商合约', period: '2025年1-12月', share: 45, price: 445, year: '2025', company: '新能源公司', station: '风电场C', notes: '年度固定电价' },
                    { name: '', type: '月度集中竞价合约', period: '2025年1-12月', share: 55, price: 0, year: '2025', company: '新能源公司', station: '风电场C', notes: '' },
                    { name: '光伏电站B2025年度合约', type: '年度双边协商合约', period: '2025年1-12月', share: 50, price: 458, year: '2025', company: '新能源公司', station: '光伏电站B', notes: '年度固定电价' }
                ];
                
                var errors = [];
                mockData.forEach(function(row, i) {
                    if (!row.name) errors.push('第' + (i + 2) + '行：合约名称不能为空');
                });
                
                fileRecord.parsedData = mockData;
                fileRecord.rowCount = mockData.length;
                fileRecord.validCount = mockData.length - errors.length;
                fileRecord.invalidCount = errors.length;
                fileRecord.errors = errors;
                fileRecord.status = '已解析';
                
                currentContractPreviewData = mockData;
                
                document.getElementById('contract-preview-total').textContent = mockData.length;
                document.getElementById('contract-preview-valid').textContent = fileRecord.validCount;
                document.getElementById('contract-preview-invalid').textContent = fileRecord.invalidCount;
                
                var headers = ['合约名称', '交易品类', '交易时段', '电量占比(%)', '电价(元/MWh)', '年度', '所属公司', '关联场站', '备注说明'];
                var headerHtml = '<tr>';
                headers.forEach(function(h) { headerHtml += '<th>' + h + '</th>'; });
                headerHtml += '</tr>';
                document.getElementById('contract-preview-thead').innerHTML = headerHtml;
                
                var bodyHtml = '';
                mockData.forEach(function(row, i) {
                    var bgClass = !row.name ? 'style="background:#fff2f0"' : '';
                    bodyHtml += '<tr ' + bgClass + '>' +
                        '<td>' + (row.name || '<span style="color:var(--danger)">空</span>') + '</td>' +
                        '<td>' + row.type + '</td>' +
                        '<td>' + row.period + '</td>' +
                        '<td>' + row.share + '%</td>' +
                        '<td>' + (row.price > 0 ? row.price : '按交易均价') + '</td>' +
                        '<td>' + row.year + '年</td>' +
                        '<td>' + row.company + '</td>' +
                        '<td>' + row.station + '</td>' +
                        '<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (row.notes || '-') + '</td>' +
                        '</tr>';
                });
                document.getElementById('contract-preview-tbody').innerHTML = bodyHtml;
                
                if (errors.length > 0) {
                    var errorHtml = '<strong style="color:var(--danger)">校验错误：</strong><br>';
                    errors.forEach(function(err) {
                        errorHtml += '<div style="padding:4px 0;color:var(--danger);font-size:var(--text-sm)">' + err + '</div>';
                    });
                    document.getElementById('contract-preview-errors').innerHTML = errorHtml;
                    document.getElementById('contract-preview-errors').style.display = 'block';
                } else {
                    document.getElementById('contract-preview-errors').style.display = 'none';
                }
                
                renderContractImportFileList();
                document.getElementById('contract-preview-modal').style.display = 'flex';
            }, 500);
        }

        function closeContractPreviewModal() {
            document.getElementById('contract-preview-modal').style.display = 'none';
        }

        function confirmContractImport() {
            if (!currentContractPreviewFile || !currentContractPreviewData) return;
            
            var successCount = 0;
            var failedCount = 0;
            
            currentContractPreviewData.forEach(function(row, i) {
                if (!row.name) {
                    failedCount++;
                    return;
                }
                
                var existingIndex = contractData.findIndex(function(c) { return c.name === row.name; });
                if (existingIndex >= 0) {
                    contractData[existingIndex] = row;
                } else {
                    contractData.push(row);
                }
                successCount++;
            });
            
            currentContractPreviewFile.status = failedCount === 0 ? '已导入' : '部分成功';
            renderContractImportFileList();
            closeContractPreviewModal();
            
            if (failedCount > 0) {
                alert('导入完成：成功 ' + successCount + ' 条，失败 ' + failedCount + ' 条');
            } else {
                alert('导入完成：全部 ' + successCount + ' 条数据导入成功');
            }
            renderContracts();
        }

        document.getElementById('contract-modal').addEventListener('click', function(e) {
            if (e.target === this) closeContractModal();
        });

        renderContracts();

        window.openContractModal = openContractModal;
        window.closeContractModal = closeContractModal;
        window.saveContract = saveContract;
        window.deleteContract = deleteContract;
        window.filterContracts = filterContracts;
        window.downloadContractTemplate = downloadContractTemplate;
        window.openContractImportModal = openContractImportModal;
        window.closeContractImportModal = closeContractImportModal;
        window.handleContractImport = handleContractImport;
        window.parseContractPreview = parseContractPreview;
        window.closeContractPreviewModal = closeContractPreviewModal;
        window.confirmContractImport = confirmContractImport;
        window.deleteContractImportFile = deleteContractImportFile;
    </script>
</body>
</html>
