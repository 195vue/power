<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据字典 - 新能源电力交易辅助决策系统</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">数据字典</h2>
            <p class="page-subtitle">维护系统基础编码数据，如交易品种、电源类型、场站类型等，支撑系统所有下拉选择和编码映射</p>
        </div>

        <div class="dict-layout">
            <!-- 左侧：字典类型列表 -->
            <div class="dict-sidebar">
                <div class="sidebar-header">
                    <h4>字典类型</h4>
                    <button class="sidebar-add-btn" onclick="openTypeModal()">+ 新增类型</button>
                </div>
                <div class="sidebar-search">
                    <input type="text" placeholder="搜索字典类型" id="type-search" oninput="filterTypes()">
                </div>
                <div class="type-list" id="type-list"></div>
            </div>

            <!-- 右侧：编码列表 -->
            <div class="dict-content">
                <div class="content-header">
                    <div class="content-title">
                        <h3 id="content-title">交易品种</h3>
                        <span class="content-count" id="content-count">共 0 条记录</span>
                    </div>
                    <div class="content-actions">
                        <button class="btn-primary" onclick="openDictModal()">+ 新增编码</button>
                    </div>
                </div>

                <div class="filter-bar" style="margin-bottom: var(--space-4)">
                    <div class="filter-item">
                        <label>编码</label>
                        <input class="filter-input" placeholder="搜索编码" style="width:150px" id="dict-search-code">
                    </div>
                    <div class="filter-item">
                        <label>名称</label>
                        <input class="filter-input" placeholder="搜索名称" style="width:150px" id="dict-search-name">
                    </div>
                    <button class="btn-primary" onclick="filterDict()">查询</button>
                </div>

                <div class="table-section">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width:80px">序号</th>
                                <th>编码</th>
                                <th>名称</th>
                                <th>排序号</th>
                                <th>状态</th>
                                <th style="width:150px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="dict-table-body"></tbody>
                    </table>
                    <div class="pagination">
                        <span class="info-text" id="dict-count">共 0 条记录</span>
                        <div><button class="page-btn active">1</button></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 新增/编辑编码弹窗 -->
    <div class="modal-overlay" id="dict-modal" style="display:none">
        <div class="modal-panel" style="width:480px">
            <div class="modal-header">
                <h3 id="dict-modal-title">新增编码</h3>
                <button class="modal-close" onclick="closeDictModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">编码 <span style="color:var(--danger)">*</span></label>
                        <input class="form-input" id="dict-code" placeholder="编码 Key，如：BILATERAL">
                        <span class="field-help">编码应为英文大写，无空格，唯一标识</span>
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">名称 <span style="color:var(--danger)">*</span></label>
                        <input class="form-input" id="dict-name" placeholder="显示名称">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">排序号</label>
                        <input class="form-input" id="dict-order" type="number" placeholder="排序，数字越小越靠前">
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">状态</label>
                        <select class="form-input" id="dict-status">
                            <option>启用</option>
                            <option>停用</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeDictModal()">取消</button>
                <button class="btn-primary" onclick="saveDict()">保存</button>
            </div>
        </div>
    </div>

    <!-- 新增字典类型弹窗 -->
    <div class="modal-overlay" id="type-modal" style="display:none">
        <div class="modal-panel" style="width:420px">
            <div class="modal-header">
                <h3 id="type-modal-title">新增字典类型</h3>
                <button class="modal-close" onclick="closeTypeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-section">
                    <label class="form-label">类型名称 <span style="color:var(--danger)">*</span></label>
                    <input class="form-input" id="type-name" placeholder="如：交易品种">
                </div>
                <div class="form-section">
                    <label class="form-label">类型编码 <span style="color:var(--danger)">*</span></label>
                    <input class="form-input" id="type-code" placeholder="如：trade-type">
                    <span class="field-help">类型编码应为小写英文，使用连字符，唯一标识</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeTypeModal()">取消</button>
                <button class="btn-primary" onclick="saveType()">保存</button>
            </div>
        </div>
    </div>

    <style>
        .dict-layout {

        }

        .dict-sidebar {

            overflow: hidden;
        }

        .sidebar-header {
            padding: var(--space-3);

            display: flex;
            align-items: center;

        }

        .sidebar-header h4 {
            margin: 0;
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--fg);
        }

        .sidebar-add-btn {
            padding: var(--space-1) var(--space-2);
            font-size: var(--text-xs);
            background: var(--accent);
            color: var(--accent-on);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--motion-fast);
        }

        .sidebar-add-btn:hover {
            background: var(--accent-hover);
        }

        .sidebar-search {
            padding: var(--space-3);
            border-bottom: 1px solid var(--border);
        }

        .sidebar-search input {
            width: 100%;
            padding: var(--space-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            background: var(--bg);
            color: var(--fg);
            outline: none;
        }

        .sidebar-search input:focus {
            border-color: var(--accent);
        }

        .sidebar-search input::placeholder {
            color: var(--muted);
        }

        .type-list {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-2);
        }

        .type-item {
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--text-sm);
            color: var(--fg);
            margin-bottom: 2px;
            transition: all var(--motion-fast);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .type-item:hover {
            background: var(--bg);
        }

        .type-item.active {
            background: color-mix(in oklab, var(--accent), transparent 90%);
            color: var(--accent);
            font-weight: 500;
        }

        .type-count {
            font-size: var(--text-xs);
            color: var(--muted);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: var(--radius-pill);
        }

        .dict-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-4);
        }

        .content-title {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .content-title h3 {
            margin: 0;
            font-size: var(--text-lg);
            font-weight: 600;
        }

        .content-count {
            font-size: var(--text-sm);
            color: var(--muted);
        }

        .table-section {
            flex: 1;
            overflow-y: auto;
        }

        .field-help {
            font-size: var(--text-xs);
            color: var(--meta);
            margin-top: 2px;
            display: block;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            display: inline-block;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4a5568;
            transition: 0.3s;
            border-radius: 12px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #48bb78;
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .status-text {
            font-size: var(--text-xs);
            color: var(--muted);
            margin-left: 8px;
            vertical-align: middle;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }
    </style>

            ],

            ],

                { code: 'GRID_COMPANY', name: '省电力公司', order: 6, status: '启用' },
                { code: 'CONTRACT_SYSTEM', name: '内部合约管理系统', order: 7, status: '启用' },
                { code: 'FINANCE_SYSTEM', name: '内部财务/结算系统', order: 8, status: '启用' },
                { code: 'PRODUCTION_PLAN', name: '内部生产计划/年度预算系统', order: 9, status: '启用' },
                { code: 'POWER_FORECAST', name: '功率预测系统', order: 10, status: '启用' },
                { code: 'PRICE_FORECAST', name: '电价预测模型', order: 11, status: '启用' },
                { code: 'LOAD_FORECAST', name: '负荷预测模型', order: 12, status: '启用' }
            ],
            'data-channel': [
                { code: 'INTERFACE_API', name: '数据接口API', order: 1, status: '启用' },
                { code: 'SCADA_DIRECT', name: 'SCADA直采', order: 2, status: '启用' },
                { code: 'METER_READING', name: '电能表读数', order: 3, status: '启用' },
                { code: 'FILE_IMPORT', name: '文件导入', order: 4, status: '启用' },
                { code: 'MANUAL_INPUT', name: '人工录入', order: 5, status: '启用' },
                { code: 'SYSTEM_CALC', name: '系统计算', order: 6, status: '启用' },
                { code: 'PUBLIC_DATA', name: '公开数据', order: 7, status: '启用' },
                { code: 'SIMULATION', name: '模拟数据', order: 8, status: '启用' }
            ],
            'data-status': [
                { code: 'COLLECTED', name: '已归集', order: 1, status: '启用' },
                { code: 'COLLECTING', name: '归集中', order: 2, status: '启用' },
                { code: 'SIMULATED', name: '模拟数据', order: 3, status: '启用' },
                { code: 'UNAVAILABLE', name: '无法归集', order: 4, status: '启用' }
            ]
        };

        var currentType = 'trade-type';
        var dictEditIndex = -1;

        function renderTypeList(filterText) {
            var list = document.getElementById('type-list');
            list.innerHTML = '';
            var filtered = dictTypes.filter(function(t) {
                return !filterText || t.name.toLowerCase().includes(filterText.toLowerCase());
            });
            filtered.forEach(function(t) {
                var cls = t.key === currentType ? 'type-item active' : 'type-item';
                list.innerHTML += '<div class="' + cls + '" data-key="' + t.key + '" onclick="selectType(\'' + t.key + '\')">' +
                    '<span>' + t.name + '</span>' +
                    '<span class="type-count">' + t.count + '</span>' +
                    '</div>';
            });
        }

        function selectType(key) {
            currentType = key;
            var type = dictTypes.find(function(t) { return t.key === key; });
            if (type) {
                document.getElementById('content-title').textContent = type.name;
                document.getElementById('content-count').textContent = '共 ' + type.count + ' 条记录';
            }
            renderTypeList();
            renderDict();
        }

        function filterTypes() {
            var text = document.getElementById('type-search').value;
            renderTypeList(text);
        }

        function renderDict() {
            var data = dictData[currentType] || [];
            var tbody = document.getElementById('dict-table-body');
            tbody.innerHTML = '';
            data.forEach(function(d, i) {
                var checked = d.status === '启用' ? 'checked' : '';
                tbody.innerHTML += '<tr>' +
                    '<td>' + (i + 1) + '</td>' +
                    '<td>' + d.code + '</td>' +
                    '<td>' + d.name + '</td>' +
                    '<td>' + d.order + '</td>' +
                    '<td>' +
                    '<label class="toggle-switch">' +
                    '<input type="checkbox" ' + checked + ' onchange="toggleStatus(' + i + ')">' +
                    '<span class="toggle-slider"></span>' +
                    '</label>' +
                    '<span class="status-text">' + d.status + '</span>' +
                    '</td>' +
                    '<td><div class="action-buttons">' +
                    '<button class="btn-config" onclick="openDictModal(' + i + ')" style="padding:var(--space-1) var(--space-3);font-size:var(--text-sm)">编辑</button>' +
                    '<button class="btn-delete" onclick="deleteDict(' + i + ')" style="padding:var(--space-1) var(--space-3);font-size:var(--text-sm)">删除</button>' +
                    '</div></td></tr>';
            });
            document.getElementById('dict-count').textContent = '共 ' + data.length + ' 条记录';
        }

        function toggleStatus(index) {
            var data = dictData[currentType][index];
            data.status = data.status === '启用' ? '停用' : '启用';
            renderDict();
        }

        function openDictModal(index) {
            var modal = document.getElementById('dict-modal');
            if (index === undefined || index === null) {
                dictEditIndex = -1;
                document.getElementById('dict-modal-title').textContent = '新增编码';
                document.getElementById('dict-code').value = '';
                document.getElementById('dict-name').value = '';
                document.getElementById('dict-order').value = '';
                document.getElementById('dict-status').value = '启用';
            } else {
                dictEditIndex = index;
                document.getElementById('dict-modal-title').textContent = '编辑编码';
                var d = dictData[currentType][index];
                document.getElementById('dict-code').value = d.code;
                document.getElementById('dict-name').value = d.name;
                document.getElementById('dict-order').value = d.order;
                document.getElementById('dict-status').value = d.status;
            }
            modal.style.display = 'flex';
        }

        function closeDictModal() {
            document.getElementById('dict-modal').style.display = 'none';
        }

        function saveDict() {
            var data = {
                code: document.getElementById('dict-code').value,
                name: document.getElementById('dict-name').value,
                order: parseInt(document.getElementById('dict-order').value) || 0,
                status: document.getElementById('dict-status').value
            };
            if (!data.code) { alert('请输入编码'); return; }
            if (!data.name) { alert('请输入名称'); return; }
            if (dictEditIndex === -1) {
                if (!dictData[currentType]) dictData[currentType] = [];
                dictData[currentType].push(data);
                var type = dictTypes.find(function(t) { return t.key === currentType; });
                if (type) type.count++;
            } else {
                dictData[currentType][dictEditIndex] = data;
            }
            renderTypeList();
            renderDict();
            closeDictModal();
        }

        function deleteDict(index) {
            var name = dictData[currentType][index].name;
            if (confirm('确认删除编码「' + name + '」？')) {
                dictData[currentType].splice(index, 1);
                var type = dictTypes.find(function(t) { return t.key === currentType; });
                if (type) type.count--;
                renderTypeList();
                renderDict();
            }
        }

        function filterDict() {
            renderDict();
        }

        function openTypeModal() {
            document.getElementById('type-modal-title').textContent = '新增字典类型';
            document.getElementById('type-name').value = '';
            document.getElementById('type-code').value = '';
            document.getElementById('type-modal').style.display = 'flex';
        }

        function closeTypeModal() {
            document.getElementById('type-modal').style.display = 'none';
        }

        function saveType() {
            var name = document.getElementById('type-name').value;
            var code = document.getElementById('type-code').value;
            if (!name) { alert('请输入类型名称'); return; }
            if (!code) { alert('请输入类型编码'); return; }
            dictTypes.push({ key: code, name: name, count: 0 });
            dictData[code] = [];
            renderTypeList();
            closeTypeModal();
        }

        var _dictModal = document.getElementById('dict-modal');
        if (_dictModal) {
            _dictModal.addEventListener('click', function(e) { if (e.target === this) closeDictModal(); });
        }

        var _typeModal = document.getElementById('type-modal');
        if (_typeModal) {
            _typeModal.addEventListener('click', function(e) { if (e.target === this) closeTypeModal(); });
        }

        renderTypeList();
        renderDict();
    </script>
