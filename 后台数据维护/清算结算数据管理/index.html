<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清算结算数据管理 - 新能源电力交易辅助决策系统</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">清算结算数据管理</h2>
            <p class="page-subtitle">管理交易结算单、清算电量与电价数据，支撑收益分析与结算核对</p>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchSettlementTab('settlement')">结算单管理</button>
            <button class="tab-btn" onclick="switchSettlementTab('clearing')">清算数据</button>
            <button class="tab-btn" onclick="switchSettlementTab('revenue')">收益分析</button>
        </div>

        <div id="tab-settlement" class="tab-content" style="display:block">
            <div class="filter-bar">
                <div class="filter-item">
                    <label>结算月份</label>
                    <input class="filter-select" type="month" id="settlement-filter-month" style="width:140px">
                </div>
                <div class="filter-item">
                    <label>结算类型</label>
                    <select class="filter-select" style="width:140px" id="settlement-filter-type">
                        <option value="all">全部类型</option>
                        <option>日前结算</option>
                        <option>实时结算</option>
                        <option>中长期结算</option>
                        <option>偏差结算</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>结算状态</label>
                    <select class="filter-select" style="width:120px" id="settlement-filter-status">
                        <option value="all">全部状态</option>
                        <option>待确认</option>
                        <option>已确认</option>
                        <option>已结算</option>
                        <option>已对账</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="filterSettlement()">查询</button>
                <div style="flex:1"></div>
                <span class="info-text" style="margin-right:var(--space-3);color:var(--muted);font-size:var(--text-sm)">数据来源：省电力交易中心API对接</span>
                <button class="btn-primary" onclick="openSettlementModal()">+ 新增结算单</button>
            </div>

            <div class="table-section" style="margin-top: var(--space-4)">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>结算月份</th>
                            <th>结算单号</th>
                            <th>结算类型</th>
                            <th>交易电量(MWh)</th>
                            <th>结算电价(元/MWh)</th>
                            <th>结算金额(万元)</th>
                            <th>场站名称</th>
                            <th>结算状态</th>
                            <th style="width:140px">操作</th>
                        </tr>
                    </thead>
                    <tbody id="settlement-table-body"></tbody>
                </table>
                <div class="pagination">
                    <span class="info-text" id="settlement-count">共 0 条记录</span>
                    <div>
                        <button class="page-btn active">1</button>
                        <button class="page-btn">2</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-clearing" class="tab-content" style="display:none">
            <div class="filter-bar">
                <div class="filter-item">
                    <label>日期</label>
                    <input class="filter-select" type="date" id="clearing-filter-date" style="width:140px">
                </div>
                <div class="filter-item">
                    <label>交易类型</label>
                    <select class="filter-select" style="width:140px" id="clearing-filter-type">
                        <option value="all">全部类型</option>
                        <option>日前交易</option>
                        <option>实时交易</option>
                        <option>中长期交易</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="filterClearing()">查询</button>
                <div style="flex:1"></div>
                <button class="btn-default" onclick="exportClearingData()">导出数据</button>
            </div>
            <div class="table-section" style="margin-top: var(--space-4)">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>交易时段</th>
                            <th>交易类型</th>
                            <th>场站名称</th>
                            <th>出清电量(MWh)</th>
                            <th>出清电价(元/MWh)</th>
                            <th>清算电量(MWh)</th>
                            <th>清算电价(元/MWh)</th>
                            <th>清算金额(元)</th>
                        </tr>
                    </thead>
                    <tbody id="clearing-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-revenue" class="tab-content" style="display:none">
            <div class="filter-bar">
                <div class="filter-item">
                    <label>月份</label>
                    <input class="filter-select" type="month" id="revenue-filter-month" style="width:140px">
                </div>
                <div class="filter-item">
                    <label>场站名称</label>
                    <select class="filter-select" style="width:160px" id="revenue-filter-station">
                        <option value="all">全部场站</option>
                        <option>桂阳月和风电场</option>
                        <option>光伏电站A</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="filterRevenue()">查询</button>
                <div style="flex:1"></div>
                <button class="btn-default" onclick="exportRevenueData()">导出数据</button>
            </div>
            <div class="table-section" style="margin-top: var(--space-4)">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>月份</th>
                            <th>场站名称</th>
                            <th>中长期收益(万元)</th>
                            <th>现货收益(万元)</th>
                            <th>偏差考核(万元)</th>
                            <th>总收益(万元)</th>
                            <th>单位电价(元/MWh)</th>
                            <th>同比(%)</th>
                            <th>环比(%)</th>
                        </tr>
                    </thead>
                    <tbody id="revenue-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="settlement-modal" style="display:none">
        <div class="modal-panel" style="width:640px">
            <div class="modal-header">
                <h3 id="settlement-modal-title">新增结算单</h3>
                <button class="modal-close" onclick="closeSettlementModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>结算月份 <span class="required">*</span></label>
                        <input type="month" class="form-input" id="settlement-month" required>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>结算单号</label>
                        <input type="text" class="form-input" id="settlement-no" placeholder="自动生成">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>结算类型 <span class="required">*</span></label>
                        <select class="form-input" id="settlement-type">
                            <option>日前结算</option>
                            <option>实时结算</option>
                            <option>中长期结算</option>
                            <option>偏差结算</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>结算状态</label>
                        <select class="form-input" id="settlement-status">
                            <option>待确认</option>
                            <option>已确认</option>
                            <option>已结算</option>
                            <option>已对账</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>场站名称</label>
                        <select class="form-input" id="settlement-station">
                            <option>桂阳月和风电场</option>
                            <option>光伏电站A</option>
                            <option>风电场B</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>交易电量(MWh)</label>
                        <input type="number" step="0.01" class="form-input" id="settlement-volume">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>结算电价(元/MWh)</label>
                        <input type="number" step="0.01" class="form-input" id="settlement-price">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>结算金额(万元)</label>
                        <input type="number" step="0.01" class="form-input" id="settlement-amount">
                    </div>
                </div>
                <div class="form-group">
                    <label>备注说明</label>
                    <textarea class="form-input" id="settlement-note" rows="3" placeholder="请输入备注信息"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-default" onclick="closeSettlementModal()">取消</button>
                <button class="btn-primary" onclick="saveSettlement()">保存</button>
            </div>
        </div>
    </div>

    <script>
        var settlementData = [
            { month: '2025-10', no: 'JS202510001', type: '中长期结算', station: '桂阳月和风电场', volume: 22000, price: 435.20, amount: 957.44, status: '已对账', note: '' },
            { month: '2025-10', no: 'JS202510002', type: '日前结算', station: '桂阳月和风电场', volume: 2200, price: 385.60, amount: 84.83, status: '已对账', note: '' },
            { month: '2025-10', no: 'JS202510003', type: '实时结算', station: '桂阳月和风电场', volume: 220, price: 412.80, amount: 9.08, status: '已对账', note: '' },
            { month: '2025-10', no: 'JS202510004', type: '偏差结算', station: '桂阳月和风电场', volume: -150, price: 350.00, amount: -5.25, status: '已对账', note: '' },
            { month: '2025-11', no: 'JS202511001', type: '中长期结算', station: '桂阳月和风电场', volume: 23800, price: 440.50, amount: 1048.39, status: '已结算', note: '' },
            { month: '2025-11', no: 'JS202511002', type: '日前结算', station: '桂阳月和风电场', volume: 2580, price: 397.91, amount: 102.66, status: '已结算', note: '' },
            { month: '2025-11', no: 'JS202511003', type: '实时结算', station: '桂阳月和风电场', volume: 258, price: 425.50, amount: 11.08, status: '已结算', note: '' },
            { month: '2025-11', no: 'JS202511004', type: '偏差结算', station: '桂阳月和风电场', volume: -80, price: 360.00, amount: -2.88, status: '待确认', note: '待省交易中心确认' },
            { month: '2025-11', no: 'JS202511005', type: '中长期结算', station: '光伏电站A', volume: 68400, price: 438.00, amount: 2995.92, status: '已结算', note: '' },
            { month: '2025-12', no: 'JS202512001', type: '中长期结算', station: '桂阳月和风电场', volume: 24500, price: 442.80, amount: 1084.86, status: '待确认', note: '' }
        ];

        var clearingData = [
            { date: '2025-11-01', period: '00:00', type: '日前交易', station: '桂阳月和风电场', clearVolume: 38.50, clearPrice: 360.70, settleVolume: 38.50, settlePrice: 360.70, amount: 13886.95 },
            { date: '2025-11-01', period: '00:15', type: '日前交易', station: '桂阳月和风电场', clearVolume: 37.80, clearPrice: 360.70, settleVolume: 37.80, settlePrice: 360.70, amount: 13634.46 },
            { date: '2025-11-01', period: '07:00', type: '日前交易', station: '桂阳月和风电场', clearVolume: 48.50, clearPrice: 397.91, settleVolume: 48.50, settlePrice: 397.91, amount: 19308.64 },
            { date: '2025-11-01', period: '12:00', type: '日前交易', station: '桂阳月和风电场', clearVolume: 45.20, clearPrice: 425.50, settleVolume: 45.20, settlePrice: 425.50, amount: 19232.60 },
            { date: '2025-11-01', period: '18:00', type: '日前交易', station: '桂阳月和风电场', clearVolume: 42.80, clearPrice: 412.80, settleVolume: 42.80, settlePrice: 412.80, amount: 17667.84 },
            { date: '2025-11-01', period: '23:00', type: '日前交易', station: '桂阳月和风电场', clearVolume: 39.20, clearPrice: 375.60, settleVolume: 39.20, settlePrice: 375.60, amount: 14723.52 },
            { date: '2025-11-01', period: '00:00', type: '实时交易', station: '桂阳月和风电场', clearVolume: 0.50, clearPrice: 350.00, settleVolume: 0.50, settlePrice: 350.00, amount: 175.00 },
            { date: '2025-11-01', period: '12:00', type: '实时交易', station: '桂阳月和风电场', clearVolume: 1.20, clearPrice: 450.00, settleVolume: 1.20, settlePrice: 450.00, amount: 540.00 }
        ];

        var revenueData = [
            { month: '2025-10', station: '桂阳月和风电场', mlRevenue: 957.44, spotRevenue: 93.91, deviation: -5.25, total: 1046.10, unitPrice: 435.88, yoy: 12.50, mom: 3.80 },
            { month: '2025-11', station: '桂阳月和风电场', mlRevenue: 1048.39, spotRevenue: 113.74, deviation: -2.88, total: 1159.25, unitPrice: 442.02, yoy: 15.20, mom: 10.82 },
            { month: '2025-10', station: '光伏电站A', mlRevenue: 2892.40, spotRevenue: 315.60, deviation: -18.50, total: 3189.50, unitPrice: 430.20, yoy: 8.80, mom: -2.50 },
            { month: '2025-11', station: '光伏电站A', mlRevenue: 2995.92, spotRevenue: 352.80, deviation: -12.30, total: 3336.42, unitPrice: 435.50, yoy: 11.20, mom: 4.61 }
        ];

        var editingSettlementIndex = -1;

        function switchSettlementTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(content) { content.style.display = 'none'; });
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).style.display = 'block';
            if (tab === 'settlement') renderSettlementTable();
            else if (tab === 'clearing') renderClearingTable();
            else renderRevenueTable();
        }

        function renderSettlementTable() {
            var tbody = document.getElementById('settlement-table-body');
            tbody.innerHTML = '';
            settlementData.forEach(function(item, idx) {
                var statusClass = item.status === '待确认' ? 'badge-muted' : 
                                  item.status === '已确认' ? 'badge-warning' : 
                                  item.status === '已结算' ? 'badge-success' : 'badge-primary';
                tbody.innerHTML += '<tr>' +
                    '<td>' + item.month + '</td>' +
                    '<td>' + item.no + '</td>' +
                    '<td>' + item.type + '</td>' +
                    '<td>' + item.volume + '</td>' +
                    '<td>' + item.price + '</td>' +
                    '<td>' + item.amount + '</td>' +
                    '<td>' + item.station + '</td>' +
                    '<td><span class="badge ' + statusClass + '">' + item.status + '</span></td>' +
                    '<td>' +
                        '<button class="btn-default" onclick="openSettlementModal(' + idx + ')" style="padding:2px 8px;font-size:12px">编辑</button> ' +
                        '<button class="btn-delete" onclick="deleteSettlement(' + idx + ')" style="padding:2px 8px;font-size:12px">删除</button>' +
                    '</td>' +
                    '</tr>';
            });
            document.getElementById('settlement-count').textContent = '共 ' + settlementData.length + ' 条记录';
        }

        function filterSettlement() {
            var month = document.getElementById('settlement-filter-month').value;
            var type = document.getElementById('settlement-filter-type').value;
            var status = document.getElementById('settlement-filter-status').value;
            var filtered = settlementData.filter(function(item) {
                var matchMonth = !month || item.month === month;
                var matchType = type === 'all' || item.type === type;
                var matchStatus = status === 'all' || item.status === status;
                return matchMonth && matchType && matchStatus;
            });
            var tbody = document.getElementById('settlement-table-body');
            tbody.innerHTML = '';
            filtered.forEach(function(item, idx) {
                var statusClass = item.status === '待确认' ? 'badge-muted' : 
                                  item.status === '已确认' ? 'badge-warning' : 
                                  item.status === '已结算' ? 'badge-success' : 'badge-primary';
                tbody.innerHTML += '<tr>' +
                    '<td>' + item.month + '</td>' +
                    '<td>' + item.no + '</td>' +
                    '<td>' + item.type + '</td>' +
                    '<td>' + item.volume + '</td>' +
                    '<td>' + item.price + '</td>' +
                    '<td>' + item.amount + '</td>' +
                    '<td>' + item.station + '</td>' +
                    '<td><span class="badge ' + statusClass + '">' + item.status + '</span></td>' +
                    '<td>' +
                        '<button class="btn-default" onclick="openSettlementModal(' + idx + ')" style="padding:2px 8px;font-size:12px">编辑</button> ' +
                        '<button class="btn-delete" onclick="deleteSettlement(' + idx + ')" style="padding:2px 8px;font-size:12px">删除</button>' +
                    '</td>' +
                    '</tr>';
            });
            document.getElementById('settlement-count').textContent = '共 ' + filtered.length + ' 条记录';
        }

        function openSettlementModal(index) {
            editingSettlementIndex = index;
            if (index >= 0) {
                var item = settlementData[index];
                document.getElementById('settlement-modal-title').textContent = '编辑结算单';
                document.getElementById('settlement-month').value = item.month;
                document.getElementById('settlement-no').value = item.no;
                document.getElementById('settlement-type').value = item.type;
                document.getElementById('settlement-status').value = item.status;
                document.getElementById('settlement-station').value = item.station;
                document.getElementById('settlement-volume').value = item.volume;
                document.getElementById('settlement-price').value = item.price;
                document.getElementById('settlement-amount').value = item.amount;
                document.getElementById('settlement-note').value = item.note || '';
            } else {
                document.getElementById('settlement-modal-title').textContent = '新增结算单';
                document.getElementById('settlement-month').value = '';
                document.getElementById('settlement-no').value = '';
                document.getElementById('settlement-type').value = '中长期结算';
                document.getElementById('settlement-status').value = '待确认';
                document.getElementById('settlement-station').value = '桂阳月和风电场';
                document.getElementById('settlement-volume').value = '';
                document.getElementById('settlement-price').value = '';
                document.getElementById('settlement-amount').value = '';
                document.getElementById('settlement-note').value = '';
            }
            document.getElementById('settlement-modal').style.display = 'flex';
        }

        function closeSettlementModal() {
            document.getElementById('settlement-modal').style.display = 'none';
            editingSettlementIndex = -1;
        }

        function saveSettlement() {
            var month = document.getElementById('settlement-month').value;
            var no = document.getElementById('settlement-no').value;
            var type = document.getElementById('settlement-type').value;
            var status = document.getElementById('settlement-status').value;
            var station = document.getElementById('settlement-station').value;
            var volume = parseFloat(document.getElementById('settlement-volume').value) || null;
            var price = parseFloat(document.getElementById('settlement-price').value) || null;
            var amount = parseFloat(document.getElementById('settlement-amount').value) || null;
            var note = document.getElementById('settlement-note').value;

            if (!month) {
                alert('请选择结算月份');
                return;
            }

            if (!no) {
                var now = new Date();
                no = 'JS' + now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(settlementData.length + 1).padStart(3, '0');
            }

            var newData = { month, no, type, status, station, volume, price, amount, note };
            
            if (editingSettlementIndex >= 0) {
                settlementData[editingSettlementIndex] = newData;
            } else {
                settlementData.push(newData);
            }
            
            closeSettlementModal();
            renderSettlementTable();
        }

        function deleteSettlement(index) {
            if (confirm('确认删除结算单「' + settlementData[index].no + '」？')) {
                settlementData.splice(index, 1);
                renderSettlementTable();
            }
        }

        function renderClearingTable() {
            var tbody = document.getElementById('clearing-table-body');
            tbody.innerHTML = '';
            clearingData.forEach(function(item) {
                tbody.innerHTML += '<tr>' +
                    '<td>' + item.date + '</td>' +
                    '<td>' + item.period + '</td>' +
                    '<td>' + item.type + '</td>' +
                    '<td>' + item.station + '</td>' +
                    '<td>' + item.clearVolume + '</td>' +
                    '<td>' + item.clearPrice + '</td>' +
                    '<td>' + item.settleVolume + '</td>' +
                    '<td>' + item.settlePrice + '</td>' +
                    '<td>' + item.amount.toFixed(2) + '</td>' +
                    '</tr>';
            });
        }

        function filterClearing() {
            var date = document.getElementById('clearing-filter-date').value;
            var type = document.getElementById('clearing-filter-type').value;
            var filtered = clearingData.filter(function(item) {
                var matchDate = !date || item.date === date;
                var matchType = type === 'all' || item.type === type;
                return matchDate && matchType;
            });
            var tbody = document.getElementById('clearing-table-body');
            tbody.innerHTML = '';
            filtered.forEach(function(item) {
                tbody.innerHTML += '<tr>' +
                    '<td>' + item.date + '</td>' +
                    '<td>' + item.period + '</td>' +
                    '<td>' + item.type + '</td>' +
                    '<td>' + item.station + '</td>' +
                    '<td>' + item.clearVolume + '</td>' +
                    '<td>' + item.clearPrice + '</td>' +
                    '<td>' + item.settleVolume + '</td>' +
                    '<td>' + item.settlePrice + '</td>' +
                    '<td>' + item.amount.toFixed(2) + '</td>' +
                    '</tr>';
            });
        }

        function exportClearingData() {
            var headers = ['日期', '交易时段', '交易类型', '场站名称', '出清电量(MWh)', '出清电价(元/MWh)', '清算电量(MWh)', '清算电价(元/MWh)', '清算金额(元)'];
            var csvContent = '\uFEFF' + headers.join(',') + '\n';
            clearingData.forEach(function(item) {
                csvContent += item.date + ',' + item.period + ',' + item.type + ',' + item.station + ',' +
                    item.clearVolume + ',' + item.clearPrice + ',' + item.settleVolume + ',' + 
                    item.settlePrice + ',' + item.amount.toFixed(2) + '\n';
            });
            var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '清算数据.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderRevenueTable() {
            var tbody = document.getElementById('revenue-table-body');
            tbody.innerHTML = '';
            revenueData.forEach(function(item) {
                tbody.innerHTML += '<tr>' +
                    '<td>' + item.month + '</td>' +
                    '<td>' + item.station + '</td>' +
                    '<td>' + item.mlRevenue + '</td>' +
                    '<td>' + item.spotRevenue + '</td>' +
                    '<td>' + item.deviation + '</td>' +
                    '<td>' + item.total + '</td>' +
                    '<td>' + item.unitPrice + '</td>' +
                    '<td>' + item.yoy + '</td>' +
                    '<td>' + item.mom + '</td>' +
                    '</tr>';
            });
        }

        function filterRevenue() {
            var month = document.getElementById('revenue-filter-month').value;
            var station = document.getElementById('revenue-filter-station').value;
            var filtered = revenueData.filter(function(item) {
                var matchMonth = !month || item.month === month;
                var matchStation = station === 'all' || item.station === station;
                return matchMonth && matchStation;
            });
            var tbody = document.getElementById('revenue-table-body');
            tbody.innerHTML = '';
            filtered.forEach(function(item) {
                tbody.innerHTML += '<tr>' +
                    '<td>' + item.month + '</td>' +
                    '<td>' + item.station + '</td>' +
                    '<td>' + item.mlRevenue + '</td>' +
                    '<td>' + item.spotRevenue + '</td>' +
                    '<td>' + item.deviation + '</td>' +
                    '<td>' + item.total + '</td>' +
                    '<td>' + item.unitPrice + '</td>' +
                    '<td>' + item.yoy + '</td>' +
                    '<td>' + item.mom + '</td>' +
                    '</tr>';
            });
        }

        function exportRevenueData() {
            var headers = ['月份', '场站名称', '中长期收益(万元)', '现货收益(万元)', '偏差考核(万元)', '总收益(万元)', '单位电价(元/MWh)', '同比(%)', '环比(%)'];
            var csvContent = '\uFEFF' + headers.join(',') + '\n';
            revenueData.forEach(function(item) {
                csvContent += item.month + ',' + item.station + ',' + item.mlRevenue + ',' + 
                    item.spotRevenue + ',' + item.deviation + ',' + item.total + ',' + 
                    item.unitPrice + ',' + item.yoy + ',' + item.mom + '\n';
            });
            var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '收益分析数据.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        renderSettlementTable();

        window.switchSettlementTab = switchSettlementTab;
        window.filterSettlement = filterSettlement;
        window.openSettlementModal = openSettlementModal;
        window.closeSettlementModal = closeSettlementModal;
        window.saveSettlement = saveSettlement;
        window.deleteSettlement = deleteSettlement;
        window.filterClearing = filterClearing;
        window.exportClearingData = exportClearingData;
        window.filterRevenue = filterRevenue;
        window.exportRevenueData = exportRevenueData;
    </script>
</body>
</html>
