<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结算单管理 - 新能源电力交易辅助决策系统</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">结算单管理</h2>
            <p class="page-subtitle">管理交易结算单数据，支撑收益分析与结算核对</p>
        </div>

        <div class="filter-bar">
            <div class="filter-item">
                <label>结算月份</label>
                <input class="filter-select" type="month" id="settlement-filter-month" style="width:140px">
            </div>
            <div class="filter-item">
                <label>结算类型</label>
                <select class="filter-select" style="width:140px" id="settlement-filter-type">
                    <option value="all">全部类型</option>
                    <option>日前结算</option>
                    <option>实时结算</option>
                    <option>中长期结算</option>
                    <option>偏差结算</option>
                </select>
            </div>
            <div class="filter-item">
                <label>结算状态</label>
                <select class="filter-select" style="width:120px" id="settlement-filter-status">
                    <option value="all">全部状态</option>
                    <option>待确认</option>
                    <option>已确认</option>
                    <option>已结算</option>
                    <option>已对账</option>
                </select>
            </div>
            <button class="btn-primary" onclick="filterSettlement()">查询</button>
            <div style="flex:1"></div>
            <span class="info-text" style="margin-right:var(--space-3);color:var(--muted);font-size:var(--text-sm)">数据来源：省电力交易中心API对接 + 手动导入</span>
            <button class="btn-default" onclick="downloadSettlementTemplate()">下载模板</button>
            <button class="btn-secondary" onclick="openSettlementImportModal()">导入数据</button>
            <button class="btn-default" onclick="exportSettlementData()">导出数据</button>
            <button class="btn-primary" onclick="openSettlementModal()">+ 新增结算单</button>
        </div>

        <div class="table-section" style="margin-top: var(--space-4)">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:50px"><input type="checkbox" id="settlement-select-all" onclick="toggleSettlementSelectAll()"></th>
                        <th>结算月份</th>
                        <th>结算单号</th>
                        <th>结算类型</th>
                        <th>交易电量(MWh)</th>
                        <th>结算电价(元/MWh)</th>
                        <th>结算金额(万元)</th>
                        <th>场站名称</th>
                        <th>结算状态</th>
                        <th style="width:100px">操作</th>
                    </tr>
                </thead>
                <tbody id="settlement-table-body"></tbody>
            </table>
            <div class="pagination">
                <span class="info-text" id="settlement-count">共 0 条记录</span>
                <div>
                    <button class="page-btn active">1</button>
                    <button class="page-btn">2</button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="settlement-modal" style="display:none">
        <div class="modal-panel" style="width:640px">
            <div class="modal-header">
                <h3 id="settlement-modal-title">新增结算单</h3>
                <button class="modal-close" onclick="closeSettlementModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>结算月份 <span class="required">*</span></label>
                        <input type="month" class="form-input" id="settlement-month" required>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>结算单号</label>
                        <input type="text" class="form-input" id="settlement-no" placeholder="自动生成">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>结算类型 <span class="required">*</span></label>
                        <select class="form-input" id="settlement-type">
                            <option>日前结算</option>
                            <option>实时结算</option>
                            <option>中长期结算</option>
                            <option>偏差结算</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>结算状态</label>
                        <select class="form-input" id="settlement-status">
                            <option>待确认</option>
                            <option>已确认</option>
                            <option>已结算</option>
                            <option>已对账</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>场站名称</label>
                        <select class="form-input" id="settlement-station">
                            <option>桂阳月和风电场</option>
                            <option>光伏电站A</option>
                            <option>风电场B</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>交易电量(MWh)</label>
                        <input type="number" step="0.01" class="form-input" id="settlement-volume">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>结算电价(元/MWh)</label>
                        <input type="number" step="0.01" class="form-input" id="settlement-price">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>结算金额(万元)</label>
                        <input type="number" step="0.01" class="form-input" id="settlement-amount">
                    </div>
                </div>
                <div class="form-group">
                    <label>备注说明</label>
                    <textarea class="form-input" id="settlement-note" rows="3" placeholder="请输入备注信息"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-default" onclick="closeSettlementModal()">取消</button>
                <button class="btn-primary" onclick="saveSettlement()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settlement-import-modal" style="display:none">
        <div class="modal-panel" style="width:720px">
            <div class="modal-header">
                <h3>导入结算单数据</h3>
                <button class="modal-close" onclick="closeSettlementImportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="upload-area" onclick="document.getElementById('settlement-import-file').click()">
                    <input type="file" id="settlement-import-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleSettlementFileSelect()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击选择Excel文件</div>
                    <div class="upload-hint">支持 .xlsx / .xls / .csv 格式，单个文件不超过10MB</div>
                </div>
                <div id="settlement-import-progress" style="display:none;margin-top:var(--space-4)">
                    <div class="progress-bar">
                        <div class="progress-fill" id="settlement-import-progress-fill" style="width:0%"></div>
                    </div>
                    <span class="progress-text" id="settlement-import-progress-text">0%</span>
                </div>
                <div id="settlement-import-result" style="display:none;margin-top:var(--space-4)">
                    <div id="settlement-import-result-success" class="result-success" style="display:none"></div>
                    <div id="settlement-import-result-error" class="result-error" style="display:none"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-default" onclick="closeSettlementImportModal()">关闭</button>
                <button class="btn-primary" id="settlement-import-submit-btn" onclick="confirmSettlementImport()" disabled>确认导入</button>
            </div>
        </div>
    </div>

    <script>
        var settlementData = [
            { month: '2025-10', no: 'JS202510001', type: '中长期结算', station: '桂阳月和风电场', volume: 22000, price: 435.20, amount: 957.44, status: '已对账', note: '' },
            { month: '2025-10', no: 'JS202510002', type: '日前结算', station: '桂阳月和风电场', volume: 2200, price: 385.60, amount: 84.83, status: '已对账', note: '' },
            { month: '2025-10', no: 'JS202510003', type: '实时结算', station: '桂阳月和风电场', volume: 220, price: 412.80, amount: 9.08, status: '已对账', note: '' },
            { month: '2025-10', no: 'JS202510004', type: '偏差结算', station: '桂阳月和风电场', volume: -150, price: 350.00, amount: -5.25, status: '已对账', note: '' },
            { month: '2025-11', no: 'JS202511001', type: '中长期结算', station: '桂阳月和风电场', volume: 23800, price: 440.50, amount: 1048.39, status: '已结算', note: '' },
            { month: '2025-11', no: 'JS202511002', type: '日前结算', station: '桂阳月和风电场', volume: 2580, price: 397.91, amount: 102.66, status: '已结算', note: '' },
            { month: '2025-11', no: 'JS202511003', type: '实时结算', station: '桂阳月和风电场', volume: 258, price: 425.50, amount: 11.08, status: '已结算', note: '' },
            { month: '2025-11', no: 'JS202511004', type: '偏差结算', station: '桂阳月和风电场', volume: -80, price: 360.00, amount: -2.88, status: '待确认', note: '待省交易中心确认' },
            { month: '2025-11', no: 'JS202511005', type: '中长期结算', station: '光伏电站A', volume: 68400, price: 438.00, amount: 2995.92, status: '已结算', note: '' },
            { month: '2025-12', no: 'JS202512001', type: '中长期结算', station: '桂阳月和风电场', volume: 24500, price: 442.80, amount: 1084.86, status: '待确认', note: '' }
        ];

        var editingSettlementIndex = -1;

        function renderSettlementTable() {
            var tbody = document.getElementById('settlement-table-body');
            tbody.innerHTML = '';
            settlementData.forEach(function(item, idx) {
                var statusClass = item.status === '待确认' ? 'badge-muted' : 
                                  item.status === '已确认' ? 'badge-warning' : 
                                  item.status === '已结算' ? 'badge-success' : 'badge-primary';
                tbody.innerHTML += '<tr data-index="' + idx + '">' +
                    '<td style="text-align:center"><input type="checkbox" class="settlement-row-checkbox" onclick="toggleSettlementRowSelect(' + idx + ')"></td>' +
                    '<td>' + item.month + '</td>' +
                    '<td>' + item.no + '</td>' +
                    '<td>' + item.type + '</td>' +
                    '<td>' + item.volume + '</td>' +
                    '<td>' + item.price + '</td>' +
                    '<td>' + item.amount + '</td>' +
                    '<td>' + item.station + '</td>' +
                    '<td><span class="badge ' + statusClass + '">' + item.status + '</span></td>' +
                    '<td>' +
                        '<button class="btn-default" onclick="openSettlementModal(' + idx + ')" style="padding:2px 8px;font-size:12px">编辑</button> ' +
                        '<button class="btn-delete" onclick="deleteSettlement(' + idx + ')" style="padding:2px 8px;font-size:12px">删除</button>' +
                    '</td>' +
                    '</tr>';
            });
            document.getElementById('settlement-count').textContent = '共 ' + settlementData.length + ' 条记录';
        }

        function filterSettlement() {
            var month = document.getElementById('settlement-filter-month').value;
            var type = document.getElementById('settlement-filter-type').value;
            var status = document.getElementById('settlement-filter-status').value;
            var filtered = settlementData.filter(function(item) {
                var matchMonth = !month || item.month === month;
                var matchType = type === 'all' || item.type === type;
                var matchStatus = status === 'all' || item.status === status;
                return matchMonth && matchType && matchStatus;
            });
            var tbody = document.getElementById('settlement-table-body');
            tbody.innerHTML = '';
            filtered.forEach(function(item, idx) {
                var originalIdx = settlementData.indexOf(item);
                var statusClass = item.status === '待确认' ? 'badge-muted' : 
                                  item.status === '已确认' ? 'badge-warning' : 
                                  item.status === '已结算' ? 'badge-success' : 'badge-primary';
                tbody.innerHTML += '<tr data-index="' + originalIdx + '">' +
                    '<td style="text-align:center"><input type="checkbox" class="settlement-row-checkbox" onclick="toggleSettlementRowSelect(' + originalIdx + ')"></td>' +
                    '<td>' + item.month + '</td>' +
                    '<td>' + item.no + '</td>' +
                    '<td>' + item.type + '</td>' +
                    '<td>' + item.volume + '</td>' +
                    '<td>' + item.price + '</td>' +
                    '<td>' + item.amount + '</td>' +
                    '<td>' + item.station + '</td>' +
                    '<td><span class="badge ' + statusClass + '">' + item.status + '</span></td>' +
                    '<td>' +
                        '<button class="btn-default" onclick="openSettlementModal(' + originalIdx + ')" style="padding:2px 8px;font-size:12px">编辑</button> ' +
                        '<button class="btn-delete" onclick="deleteSettlement(' + originalIdx + ')" style="padding:2px 8px;font-size:12px">删除</button>' +
                    '</td>' +
                    '</tr>';
            });
            document.getElementById('settlement-count').textContent = '共 ' + filtered.length + ' 条记录';
        }

        function openSettlementModal(index) {
            editingSettlementIndex = index;
            if (index >= 0) {
                var item = settlementData[index];
                document.getElementById('settlement-modal-title').textContent = '编辑结算单';
                document.getElementById('settlement-month').value = item.month;
                document.getElementById('settlement-no').value = item.no;
                document.getElementById('settlement-type').value = item.type;
                document.getElementById('settlement-status').value = item.status;
                document.getElementById('settlement-station').value = item.station;
                document.getElementById('settlement-volume').value = item.volume;
                document.getElementById('settlement-price').value = item.price;
                document.getElementById('settlement-amount').value = item.amount;
                document.getElementById('settlement-note').value = item.note || '';
            } else {
                document.getElementById('settlement-modal-title').textContent = '新增结算单';
                document.getElementById('settlement-month').value = '';
                document.getElementById('settlement-no').value = '';
                document.getElementById('settlement-type').value = '中长期结算';
                document.getElementById('settlement-status').value = '待确认';
                document.getElementById('settlement-station').value = '桂阳月和风电场';
                document.getElementById('settlement-volume').value = '';
                document.getElementById('settlement-price').value = '';
                document.getElementById('settlement-amount').value = '';
                document.getElementById('settlement-note').value = '';
            }
            document.getElementById('settlement-modal').style.display = 'flex';
        }

        function closeSettlementModal() {
            document.getElementById('settlement-modal').style.display = 'none';
            editingSettlementIndex = -1;
        }

        function saveSettlement() {
            var month = document.getElementById('settlement-month').value;
            var no = document.getElementById('settlement-no').value;
            var type = document.getElementById('settlement-type').value;
            var status = document.getElementById('settlement-status').value;
            var station = document.getElementById('settlement-station').value;
            var volume = parseFloat(document.getElementById('settlement-volume').value) || null;
            var price = parseFloat(document.getElementById('settlement-price').value) || null;
            var amount = parseFloat(document.getElementById('settlement-amount').value) || null;
            var note = document.getElementById('settlement-note').value;

            if (!month) {
                alert('请选择结算月份');
                return;
            }

            if (!no) {
                var now = new Date();
                no = 'JS' + now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(settlementData.length + 1).padStart(3, '0');
            }

            var newData = { month, no, type, status, station, volume, price, amount, note };
            
            if (editingSettlementIndex >= 0) {
                settlementData[editingSettlementIndex] = newData;
            } else {
                settlementData.push(newData);
            }
            
            closeSettlementModal();
            renderSettlementTable();
        }

        function deleteSettlement(index) {
            if (confirm('确认删除结算单「' + settlementData[index].no + '」？')) {
                settlementData.splice(index, 1);
                renderSettlementTable();
            }
        }

        function toggleSettlementSelectAll() {
            var checkbox = document.getElementById('settlement-select-all');
            var rowCheckboxes = document.querySelectorAll('.settlement-row-checkbox');
            rowCheckboxes.forEach(function(cb) {
                cb.checked = checkbox.checked;
            });
        }

        function toggleSettlementRowSelect(index) {
            var selectAll = document.getElementById('settlement-select-all');
            var rowCheckboxes = document.querySelectorAll('.settlement-row-checkbox');
            var allChecked = Array.from(rowCheckboxes).every(function(cb) {
                return cb.checked;
            });
            selectAll.checked = allChecked;
        }

        function exportSettlementData() {
            var selectedRows = document.querySelectorAll('.settlement-row-checkbox:checked');
            if (selectedRows.length === 0) {
                alert('请至少选择一条记录进行导出');
                return;
            }
            
            var headers = ['结算月份', '结算单号', '结算类型', '交易电量(MWh)', '结算电价(元/MWh)', '结算金额(万元)', '场站名称', '结算状态'];
            var sheet1Data = [headers];
            
            selectedRows.forEach(function(cb) {
                var tr = cb.closest('tr');
                var index = parseInt(tr.getAttribute('data-index'));
                var item = settlementData[index];
                sheet1Data.push([item.month, item.no, item.type, item.volume, item.price, item.amount, item.station, item.status]);
            });
            
            var workbook = XLSX.utils.book_new();
            var sheet1 = XLSX.utils.aoa_to_sheet(sheet1Data);
            XLSX.utils.book_append_sheet(workbook, sheet1, '导出数据');
            XLSX.writeFile(workbook, '结算数据_' + new Date().toISOString().split('T')[0] + '.xlsx');
        }

        function downloadSettlementTemplate() {
            var sheet1Data = [
                ['结算月份', '结算单号', '结算类型', '交易电量(MWh)', '结算电价(元/MWh)', '结算金额(万元)', '场站名称', '结算状态', '备注说明'],
                ['2025-11', '', '中长期结算', '23800', '440.50', '1048.39', '桂阳月和风电场', '已结算', ''],
                ['2025-11', '', '日前结算', '2580', '397.91', '102.66', '桂阳月和风电场', '已结算', '']
            ];
            
            var sheet2Data = [
                ['字段名称', '数据类型', '长度限制', '是否必填', '取值范围', '枚举值/示例', '备注说明'],
                ['结算月份', 'DATE', '7', '是', 'YYYY-MM', '', '格式如2025-11'],
                ['结算单号', 'VARCHAR', '50', '否', '', '', '为空时系统自动生成'],
                ['结算类型', 'VARCHAR', '20', '是', '', '日前结算/实时结算/中长期结算/偏差结算', ''],
                ['交易电量(MWh)', 'DECIMAL', '12,2', '是', '0-9999999', '', ''],
                ['结算电价(元/MWh)', 'DECIMAL', '10,2', '是', '0-9999', '', ''],
                ['结算金额(万元)', 'DECIMAL', '12,2', '是', '0-999999', '', '结算金额=交易电量×结算电价÷10000'],
                ['场站名称', 'VARCHAR', '50', '是', '', '', '必须为系统已存在的场站'],
                ['结算状态', 'VARCHAR', '20', '否', '', '待确认/已确认/已结算/已对账', '默认待确认'],
                ['备注说明', 'TEXT', '-', '否', '', '', '']
            ];
            
            var workbook = XLSX.utils.book_new();
            var sheet1 = XLSX.utils.aoa_to_sheet(sheet1Data);
            var sheet2 = XLSX.utils.aoa_to_sheet(sheet2Data);
            XLSX.utils.book_append_sheet(workbook, sheet1, '导入模板');
            XLSX.utils.book_append_sheet(workbook, sheet2, '字段说明');
            XLSX.writeFile(workbook, '结算单导入模板_v1.0.xlsx');
        }

        function openSettlementImportModal() {
            document.getElementById('settlement-import-modal').style.display = 'flex';
            document.getElementById('settlement-import-file').value = '';
            document.getElementById('settlement-import-progress').style.display = 'none';
            document.getElementById('settlement-import-result').style.display = 'none';
            document.getElementById('settlement-import-submit-btn').disabled = true;
        }

        function closeSettlementImportModal() {
            document.getElementById('settlement-import-modal').style.display = 'none';
        }

        function handleSettlementFileSelect() {
            var file = document.getElementById('settlement-import-file').files[0];
            if (!file) return;
            
            document.getElementById('settlement-import-progress').style.display = 'block';
            document.getElementById('settlement-import-result').style.display = 'none';
            document.getElementById('settlement-import-submit-btn').disabled = true;
            
            var progress = 0;
            var interval = setInterval(function() {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    document.getElementById('settlement-import-progress-fill').style.width = '100%';
                    document.getElementById('settlement-import-progress-text').textContent = '100%';
                    setTimeout(function() {
                        document.getElementById('settlement-import-progress').style.display = 'none';
                        document.getElementById('settlement-import-result').style.display = 'block';
                        document.getElementById('settlement-import-result-success').style.display = 'block';
                        document.getElementById('settlement-import-result-success').innerHTML = '<strong>✓ 文件解析成功</strong><br>共解析2条数据，0条错误';
                        document.getElementById('settlement-import-submit-btn').disabled = false;
                    }, 500);
                } else {
                    document.getElementById('settlement-import-progress-fill').style.width = progress + '%';
                    document.getElementById('settlement-import-progress-text').textContent = Math.round(progress) + '%';
                }
            }, 200);
        }

        function confirmSettlementImport() {
            var newItems = [
                { month: '2025-12', no: 'JS202512002', type: '日前结算', station: '桂阳月和风电场', volume: 2680, price: 402.50, amount: 107.87, status: '待确认', note: '导入数据' },
                { month: '2025-12', no: 'JS202512003', type: '实时结算', station: '桂阳月和风电场', volume: 268, price: 430.00, amount: 11.52, status: '待确认', note: '导入数据' }
            ];
            
            settlementData = settlementData.concat(newItems);
            renderSettlementTable();
            closeSettlementImportModal();
            
            var toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = '导入成功！共导入2条数据';
            toast.style.display = 'block';
            document.querySelector('.main-content').insertBefore(toast, document.querySelector('.filter-bar'));
            setTimeout(function() { toast.remove(); }, 3000);
        }

        renderSettlementTable();

        window.filterSettlement = filterSettlement;
        window.openSettlementModal = openSettlementModal;
        window.closeSettlementModal = closeSettlementModal;
        window.saveSettlement = saveSettlement;
        window.deleteSettlement = deleteSettlement;
        window.exportSettlementData = exportSettlementData;
        window.downloadSettlementTemplate = downloadSettlementTemplate;
        window.openSettlementImportModal = openSettlementImportModal;
        window.closeSettlementImportModal = closeSettlementImportModal;
    </script>
</body>
</html>
