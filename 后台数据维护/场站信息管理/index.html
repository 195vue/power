<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场站信息管理 - 新能源电力交易辅助决策系统</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">场站信息管理</h2>
            <p class="page-subtitle">场站基础参数配置与维护，参数直接影响现货申报策略生成</p>
        </div>

        <div class="filter-bar">
            <div class="filter-item">
                <label>场站名称</label>
                <select class="filter-select" style="width:180px" id="filter-name">
                    <option>全部场站</option>
                    <option>桂阳月和风电场</option>
                    <option>光伏电站A</option>
                    <option>风电场B</option>
                    <option>光伏电站C</option>
                    <option>水电站D</option>
                    <option>煤电厂E</option>
                    <option>储能电站F</option>
                </select>
            </div>
            <div class="filter-item">
                <label>所属公司</label>
                <select class="filter-select" style="width:160px" id="filter-company">
                    <option>全部公司</option>
                    <option>新能源公司</option>
                    <option>传统能源公司</option>
                    <option>独立售电公司</option>
                </select>
            </div>
            <div class="filter-item">
                <label>场站类型</label>
                <select class="filter-select" style="width:130px" id="filter-type">
                    <option>全部类型</option>
                    <option>光伏电站</option>
                    <option>风电场</option>
                    <option>水电站</option>
                    <option>火电厂</option>
                    <option>储能电站</option>
                    <option>生物质垃圾发电站</option>
                </select>
            </div>
            <button class="btn-primary" onclick="filterTable()">查询</button>
            <div style="flex:1"></div>
            <button class="btn-default" onclick="downloadStationTemplate()">下载模板</button>
            <button class="btn-default" onclick="exportStationData()">导出数据</button>
            <button class="btn-default" onclick="openImportModal()">批量导入</button>
            <button class="btn-primary" onclick="openModal()">+ 新增场站</button>
        </div>

        <div class="table-section" style="margin-top: var(--space-4)">
            <table class="data-table" id="station-table">
                <thead>
                    <tr>
                        <th style="width:50px"><input type="checkbox" id="station-select-all" onclick="toggleStationSelectAll()"></th>
                        <th>场站名称</th>
                        <th>所属公司</th>
                        <th>场站类型</th>
                        <th>装机容量(MW)</th>
                        <th>风机台数</th>
                        <th>风机型号</th>
                        <th>额定功率(kW)</th>
                        <th>叶片长度(m)</th>
                        <th>轮毂高度(m)</th>
                        <th>海拔(m)</th>
                        <th>切入风速(m/s)</th>
                        <th>切出风速(m/s)</th>
                        <th>接入方案</th>
                        <th>投产日期</th>
                        <th>状态</th>
                        <th style="width:100px">操作</th>
                    </tr>
                </thead>
                <tbody id="station-table-body"></tbody>
            </table>
            <div class="pagination">
                <span class="info-text">共 <span id="station-count">0</span> 条记录</span>
                <div>
                    <button class="page-btn active">1</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 批量导入弹窗 -->
    <div class="modal-overlay" id="import-modal" style="display:none">
        <div class="modal-panel" style="width:720px">
            <div class="modal-header">
                <h3>批量导入场站信息</h3>
                <button class="modal-close" onclick="closeImportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="padding:var(--space-3);background:var(--bg-secondary);border-radius:var(--radius);margin-bottom:var(--space-4)">
                    <strong>导入流程：</strong>
                    <div style="display:flex;gap:var(--space-4);margin-top:8px">
                        <div style="display:flex;align-items:center;gap:8px">
                            <span style="width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px">1</span>
                            <span style="font-size:var(--text-sm)">上传文件</span>
                        </div>
                        <div style="color:var(--border)">→</div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <span style="width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:12px">2</span>
                            <span style="font-size:var(--text-sm)">解析预览</span>
                        </div>
                        <div style="color:var(--border)">→</div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <span style="width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:12px">3</span>
                            <span style="font-size:var(--text-sm)">确认导入</span>
                        </div>
                    </div>
                </div>

                <div class="import-drop-area" onclick="document.getElementById('import-file').click()" style="border:2px dashed var(--border);border-radius:var(--radius);padding:var(--space-6);text-align:center;cursor:pointer;margin-bottom:var(--space-4);background:var(--bg-secondary)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;margin:0 auto var(--space-3);color:var(--muted)">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <div style="font-size:var(--text-sm);color:var(--muted)">点击或拖拽文件到此处上传</div>
                    <input type="file" id="import-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleStationImport(this)">
                </div>

                <div style="margin-bottom:var(--space-3)">
                    <h4 style="margin:0 0 var(--space-2);font-size:var(--text-sm);font-weight:600">已上传文件列表</h4>
                    <table class="data-table" style="font-size:var(--text-xs)">
                        <thead>
                            <tr>
                                <th style="width:200px">文件名</th>
                                <th style="width:120px">上传时间</th>
                                <th style="width:80px">上传人</th>
                                <th style="width:80px">数据条数</th>
                                <th style="width:100px">状态</th>
                                <th style="width:120px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="import-file-list"></tbody>
                    </table>
                    <div id="import-file-empty" style="text-align:center;color:var(--muted);padding:var(--space-4);display:none">暂无上传文件</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-default" onclick="downloadStationTemplate()">下载模板</button>
                <button class="btn-primary" onclick="document.getElementById('import-file').click()">选择文件上传</button>
            </div>
        </div>
    </div>

    <!-- 解析预览弹窗 -->
    <div class="modal-overlay" id="preview-modal" style="display:none">
        <div class="modal-panel" style="width:800px">
            <div class="modal-header">
                <h3 id="preview-title">数据预览</h3>
                <button class="modal-close" onclick="closePreviewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="padding:var(--space-2);background:var(--bg-secondary);border-radius:var(--radius);margin-bottom:var(--space-3);font-size:var(--text-sm)">
                    <strong>文件：</strong><span id="preview-filename"></span>
                    <span style="margin-left:var(--space-4)"><strong>总条数：</strong><span id="preview-total"></span></span>
                    <span style="margin-left:var(--space-4)"><strong>有效条数：</strong><span id="preview-valid"></span></span>
                    <span style="margin-left:var(--space-4)"><strong>无效条数：</strong><span id="preview-invalid"></span></span>
                </div>
                <div style="max-height:350px;overflow-y:auto">
                    <table class="data-table" id="preview-table" style="font-size:var(--text-xs)">
                        <thead id="preview-thead"></thead>
                        <tbody id="preview-tbody"></tbody>
                    </table>
                </div>
                <div id="preview-errors" style="margin-top:var(--space-3);max-height:150px;overflow-y:auto;display:none"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-default" onclick="closePreviewModal()">取消</button>
                <button class="btn-primary" onclick="confirmImportFromPreview()">确认导入</button>
            </div>
        </div>
    </div>

    <!-- 导入结果弹窗 -->
    <div class="modal-overlay" id="import-result-modal" style="display:none">
        <div class="modal-panel" style="width:560px">
            <div class="modal-header">
                <h3>导入结果</h3>
                <button class="modal-close" onclick="closeImportResultModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="import-result-summary" style="margin-bottom:var(--space-3)"></div>
                <div id="import-result-detail" style="max-height:250px;overflow-y:auto"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-default" onclick="downloadStationErrors()">下载错误数据</button>
                <button class="btn-primary" onclick="closeImportResultModal()">确定</button>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="station-detail-modal" style="display:none">
        <div class="modal-panel" style="width:600px">
            <div class="modal-header">
                <h3 id="detail-title">场站详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="detail-content"></div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="closeDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal-overlay" id="station-modal" style="display:none">
        <div class="modal-panel" style="width:600px">
            <div class="modal-header">
                <h3 id="modal-title">新增场站</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">场站名称 <span style="color:var(--danger)">*</span></label>
                        <input class="form-input" id="edit-name" placeholder="请输入场站名称">
                    </div>
                    <div class="form-section">
                        <label class="form-label">所属公司 <span style="color:var(--danger)">*</span></label>
                        <select class="form-input" id="edit-company">
                            <option>新能源公司</option>
                            <option>传统能源公司</option>
                            <option>独立售电公司</option>
                            <option>电网企业</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">场站类型 <span style="color:var(--danger)">*</span></label>
                        <select class="form-input" id="edit-station-type">
                            <option>光伏电站</option>
                            <option>风电场</option>
                            <option>水电站</option>
                            <option>火电厂</option>
                            <option>储能电站</option>
                            <option>生物质垃圾发电站</option>
                        </select>
                    </div>
                    <div class="form-section">
                        <label class="form-label">投产日期</label>
                        <input class="form-input" id="edit-commission-date" type="date">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">装机容量 (MW) <span style="color:var(--danger)">*</span></label>
                        <input class="form-input" id="edit-capacity" type="number" min="0" step="0.1" placeholder="请输入装机容量">
                    </div>
                    <div class="form-section">
                        <label class="form-label">风机台数</label>
                        <input class="form-input" id="edit-turbine-count" type="number" min="0" placeholder="风电场参数">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">最小技术出力 (MW)</label>
                        <input class="form-input" id="edit-min-output" type="number" min="0" step="0.1" placeholder="请输入最小技术出力">
                    </div>
                    <div class="form-section">
                        <label class="form-label">风机型号</label>
                        <input class="form-input" id="edit-turbine-model" placeholder="如：SE16433/SE15530">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">额定功率 (kW)</label>
                        <input class="form-input" id="edit-rated-power" placeholder="如：3300/3000">
                    </div>
                    <div class="form-section">
                        <label class="form-label">叶片长度 (m)</label>
                        <input class="form-input" id="edit-blade-length" placeholder="风电场参数">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">爬坡率上限 (MW/min)</label>
                        <input class="form-input" id="edit-ramp-up" type="number" min="0" step="0.1" placeholder="请输入爬坡率上限">
                    </div>
                    <div class="form-section">
                        <label class="form-label">爬坡率下限 (MW/min)</label>
                        <input class="form-input" id="edit-ramp-down" type="number" min="0" step="0.1" placeholder="请输入爬坡率下限">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">启停约束 (次/日)</label>
                        <input class="form-input" id="edit-start-stop" type="number" min="0" placeholder="0表示无限制">
                    </div>
                    <div class="form-section">
                        <label class="form-label">轮毂高度 (m)</label>
                        <input class="form-input" id="edit-hub-height" type="number" min="0" step="0.1" placeholder="风电场参数">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">切入风速 (m/s)</label>
                        <input class="form-input" id="edit-cut-in-speed" type="number" min="0" step="0.1" placeholder="风电场参数">
                    </div>
                    <div class="form-section">
                        <label class="form-label">切出风速 (m/s)</label>
                        <input class="form-input" id="edit-cut-out-speed" type="number" min="0" step="0.1" placeholder="风电场参数">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">经度</label>
                        <input class="form-input" id="edit-longitude" type="number" step="0.0001" placeholder="如：112.7765">
                    </div>
                    <div class="form-section">
                        <label class="form-label">纬度</label>
                        <input class="form-input" id="edit-latitude" type="number" step="0.0001" placeholder="如：25.6030">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">海拔 (m)</label>
                        <input class="form-input" id="edit-altitude" type="number" min="0" placeholder="电厂平均海拔">
                    </div>
                    <div class="form-section">
                        <label class="form-label">接入方案</label>
                        <input class="form-input" id="edit-access-scheme" placeholder="如：35kv场内集电+110kv升压送出">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">状态</label>
                        <select class="form-input" id="edit-status">
                            <option>正常</option>
                            <option>停运</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="saveStation()">保存</button>
            </div>
        </div>
    </div>

    <script>
        var stationData = [
            { name: '桂阳月和风电场', company: '新能源公司', stationType: '风电场', capacity: 50, turbineCount: 16, turbineModel: 'SE16433/SE15530', ratedPower: '3300/3000', bladeLength: '80.5/76', hubHeight: 100, altitude: 1150, cutInSpeed: 3, cutOutSpeed: 20, accessScheme: '35kv场内集电+110kv升压送出', minOutput: 0, rampUp: 2, rampDown: 2, startStop: 0, commissionDate: '2022-07-30', status: '正常', longitude: 112.7765, latitude: 25.6030 },
            { name: '光伏电站A', company: '新能源公司', stationType: '光伏电站', capacity: 150, turbineCount: '-', turbineModel: '-', ratedPower: '-', bladeLength: '-', hubHeight: '-', altitude: 500, cutInSpeed: '-', cutOutSpeed: '-', accessScheme: '10kv并网', minOutput: 0, rampUp: 5, rampDown: 5, startStop: 0, commissionDate: '2020-06-15', status: '正常', longitude: 112.9399, latitude: 28.2280 },
            { name: '风电场B', company: '新能源公司', stationType: '风电场', capacity: 200, turbineCount: 60, turbineModel: 'V110/2000', ratedPower: '2000', bladeLength: '55', hubHeight: 80, altitude: 800, cutInSpeed: 3, cutOutSpeed: 25, accessScheme: '35kv场内集电+220kv升压送出', minOutput: 10, rampUp: 8, rampDown: 6, startStop: 2, commissionDate: '2019-12-20', status: '正常', longitude: 113.0523, latitude: 28.1856 },
            { name: '光伏电站C', company: '传统能源公司', stationType: '光伏电站', capacity: 100, turbineCount: '-', turbineModel: '-', ratedPower: '-', bladeLength: '-', hubHeight: '-', altitude: 450, cutInSpeed: '-', cutOutSpeed: '-', accessScheme: '10kv并网', minOutput: 0, rampUp: 4, rampDown: 4, startStop: 0, commissionDate: '2021-03-10', status: '停运', longitude: 112.8876, latitude: 28.3124 },
            { name: '水电站D', company: '传统能源公司', stationType: '水电站', capacity: 300, turbineCount: '-', turbineModel: '-', ratedPower: '-', bladeLength: '-', hubHeight: '-', altitude: 300, cutInSpeed: '-', cutOutSpeed: '-', accessScheme: '110kv升压送出', minOutput: 50, rampUp: 12, rampDown: 10, startStop: 4, commissionDate: '2015-08-01', status: '正常', longitude: 113.1245, latitude: 28.0987 },
            { name: '煤电厂E', company: '传统能源公司', stationType: '火电厂', capacity: 600, turbineCount: '-', turbineModel: '-', ratedPower: '-', bladeLength: '-', hubHeight: '-', altitude: 150, cutInSpeed: '-', cutOutSpeed: '-', accessScheme: '220kv升压送出', minOutput: 120, rampUp: 15, rampDown: 10, startStop: 1, commissionDate: '2018-05-20', status: '正常', longitude: 112.9876, latitude: 28.2567 },
            { name: '储能电站F', company: '独立售电公司', stationType: '储能电站', capacity: 50, turbineCount: '-', turbineModel: '-', ratedPower: '-', bladeLength: '-', hubHeight: '-', altitude: 200, cutInSpeed: '-', cutOutSpeed: '-', accessScheme: '10kv并网', minOutput: 0, rampUp: 50, rampDown: 50, startStop: 10, commissionDate: '2023-01-15', status: '正常', longitude: 113.0234, latitude: 28.1987 }
        ];
        var editIndex = -1;

        function renderTable(data) {
            var tbody = document.getElementById('station-table-body');
            tbody.innerHTML = '';
            var list = data || stationData;
            list.forEach(function(s, i) {
                var index = stationData.indexOf(s);
                if (index === -1) index = i;
                var statusClass = s.status === '正常' ? 'badge-success' : 'badge-muted';
                tbody.innerHTML += '<tr data-index="' + index + '">' +
                    '<td style="text-align:center"><input type="checkbox" class="station-row-checkbox" onclick="toggleStationRowSelect(' + index + ')"></td>' +
                    '<td><strong>' + s.name + '</strong></td>' +
                    '<td>' + s.company + '</td>' +
                    '<td>' + s.stationType + '</td>' +
                    '<td>' + s.capacity + '</td>' +
                    '<td>' + s.turbineCount + '</td>' +
                    '<td>' + s.turbineModel + '</td>' +
                    '<td>' + s.ratedPower + '</td>' +
                    '<td>' + s.bladeLength + '</td>' +
                    '<td>' + s.hubHeight + '</td>' +
                    '<td>' + s.altitude + '</td>' +
                    '<td>' + s.cutInSpeed + '</td>' +
                    '<td>' + s.cutOutSpeed + '</td>' +
                    '<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + s.accessScheme + '">' + s.accessScheme + '</td>' +
                    '<td>' + s.commissionDate + '</td>' +
                    '<td><span class="badge ' + statusClass + '">' + s.status + '</span></td>' +
                    '<td>' +
                    '<button class="btn-default" onclick="viewStation(' + index + ')" style="padding:var(--space-1) var(--space-3);font-size:var(--text-sm)">详情</button> ' +
                    '<button class="btn-config" onclick="openModal(' + index + ')" style="padding:var(--space-1) var(--space-3);font-size:var(--text-sm)">编辑</button> ' +
                    '<button class="btn-delete" onclick="deleteStation(' + index + ')" style="padding:var(--space-1) var(--space-3);font-size:var(--text-sm)">删除</button>' +
                    '</td></tr>';
            });
            document.getElementById('station-count').textContent = list.length;
        }

        function openModal(index) {
            var modal = document.getElementById('station-modal');
            if (index === undefined || index === null) {
                editIndex = -1;
                document.getElementById('modal-title').textContent = '新增场站';
                document.getElementById('edit-name').value = '';
                document.getElementById('edit-company').value = '新能源公司';
                document.getElementById('edit-station-type').value = '光伏电站';
                document.getElementById('edit-capacity').value = '';
                document.getElementById('edit-min-output').value = '';
                document.getElementById('edit-ramp-up').value = '';
                document.getElementById('edit-ramp-down').value = '';
                document.getElementById('edit-start-stop').value = '';
                document.getElementById('edit-commission-date').value = '';
                document.getElementById('edit-turbine-count').value = '';
                document.getElementById('edit-turbine-model').value = '';
                document.getElementById('edit-rated-power').value = '';
                document.getElementById('edit-blade-length').value = '';
                document.getElementById('edit-hub-height').value = '';

        function handleStationImport(input) {
            var file = input.files[0];
            if (!file) return;

            var ext = file.name.split('.').pop().toLowerCase();
            if (!['xlsx', 'xls', 'csv'].includes(ext)) {
                alert('仅支持 Excel (.xlsx/.xls) 和 CSV 格式文件');
                return;
            }

            var now = new Date();
            var fileRecord = {
                id: Date.now(),
                name: file.name,
                file: file,
                uploadTime: now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + 
                         String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
                uploader: '管理员',
                status: '待解析',
                rowCount: null,
                validCount: 0,
                invalidCount: 0,
                errors: [],
                parsedData: null
            };

            importFiles.unshift(fileRecord);
            renderImportFileList();
            input.value = '';
        }

                headers.forEach(function(h) { headerHtml += '<th>' + h + '</th>'; });
                headerHtml += '</tr>';
                document.getElementById('preview-thead').innerHTML = headerHtml;
                
                var bodyHtml = '';
                mockData.forEach(function(row, i) {
                    var bgClass = !row.name ? 'style="background:#fff2f0"' : '';
                    bodyHtml += '<tr ' + bgClass + '>' +
                        '<td>' + (row.name || '<span style="color:var(--danger)">空</span>') + '</td>' +
                        '<td>' + row.company + '</td>' +
                        '<td>' + row.stationType + '</td>' +
                        '<td>' + row.capacity + '</td>' +
                        '<td>' + row.turbineCount + '</td>' +
                        '<td>' + row.turbineModel + '</td>' +
                        '<td>' + row.ratedPower + '</td>' +
                        '<td>' + row.bladeLength + '</td>' +
                        '<td>' + row.hubHeight + '</td>' +
                        '<td>' + row.altitude + '</td>' +
                        '<td>' + row.cutInSpeed + '</td>' +
                        '<td>' + row.cutOutSpeed + '</td>' +
                        '<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + row.accessScheme + '</td>' +
                        '<td>' + row.commissionDate + '</td>' +
                        '<td><span class="badge ' + (row.status === '正常' ? 'badge-success' : 'badge-muted') + '">' + row.status + '</span></td>' +
                        '</tr>';
                });
                document.getElementById('preview-tbody').innerHTML = bodyHtml;
                
                if (errors.length > 0) {
                    var errorHtml = '<strong style="color:var(--danger)">校验错误：</strong><br>';
                    errors.forEach(function(err) {
                        errorHtml += '<div style="padding:4px 0;color:var(--danger);font-size:var(--text-sm)">' + err + '</div>';
                    });
                    document.getElementById('preview-errors').innerHTML = errorHtml;
                    document.getElementById('preview-errors').style.display = 'block';
                } else {
                    document.getElementById('preview-errors').style.display = 'none';
                }
                
                renderImportFileList();
                document.getElementById('preview-modal').style.display = 'flex';
            }, 500);
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        function confirmImportFromPreview() {
            if (!currentPreviewFile || !currentPreviewData) return;
            
            var successCount = 0;
            var failedCount = 0;
            importErrors = [];
            
            currentPreviewData.forEach(function(row, i) {
                if (!row.name) {
                    failedCount++;
                    importErrors.push('第' + (i + 2) + '行：场站名称不能为空');
                    return;
                }
                
                var existingIndex = stationData.findIndex(function(s) { return s.name === row.name; });
                if (existingIndex >= 0) {
                    stationData[existingIndex] = row;
                } else {
                    stationData.push(row);
                }
                successCount++;
            });
            
            currentPreviewFile.status = failedCount === 0 ? '已导入' : '部分成功';
            renderImportFileList();
            closePreviewModal();
            showImportResult(successCount, failedCount);
        }

        function showImportResult(successCount, failedCount) {
            var totalCount = successCount + failedCount;

            var statusClass = failedCount === 0 ? 'status-success' : (successCount > 0 ? 'status-warning' : 'status-danger');
            var statusText = failedCount === 0 ? '全部成功' : (successCount > 0 ? '部分成功' : '全部失败');

            document.getElementById('import-result-summary').innerHTML = `
                <div style="display:flex;gap:var(--space-4);padding:var(--space-3);background:var(--bg-secondary);border-radius:var(--radius)">
                    <div>
                        <div style="color:var(--muted);font-size:var(--text-xs)">总条数</div>
                        <div style="font-size:var(--text-lg);font-weight:bold">${totalCount}</div>
                    </div>
                    <div>
                        <div style="color:var(--muted);font-size:var(--text-xs)">成功条数</div>
                        <div style="font-size:var(--text-lg);font-weight:bold;color:#52c41a">${successCount}</div>
                    </div>
                    <div>
                        <div style="color:var(--muted);font-size:var(--text-xs)">失败条数</div>
                        <div style="font-size:var(--text-lg);font-weight:bold;color:#ff4d4f">${failedCount}</div>
                    </div>
                    <div>
                        <div style="color:var(--muted);font-size:var(--text-xs)">状态</div>
                        <div style="font-size:var(--text-lg);font-weight:bold"><span class="tag ${statusClass}">${statusText}</span></div>
                    </div>
                </div>
            `;

            var detailHtml = '';
            if (failedCount > 0) {
                detailHtml = '<strong style="color:var(--danger)">失败详情：</strong>';
                importErrors.forEach(function(err, idx) {
                    detailHtml += '<div style="padding:8px 0;border-bottom:1px solid var(--border);color:var(--danger)">' + (idx + 1) + '. ' + err + '</div>';
                });
            } else {
                detailHtml = '<div style="color:#52c41a;text-align:center;padding:var(--space-4)">所有数据导入成功！</div>';
            }
            document.getElementById('import-result-detail').innerHTML = detailHtml;

            document.getElementById('import-result-modal').style.display = 'flex';
            
            if (successCount > 0) {
                renderTable();
            }
        }

        function closeImportResultModal() {
            document.getElementById('import-result-modal').style.display = 'none';
        }

        function downloadStationErrors() {
            if (importErrors.length === 0) {
                alert('没有错误数据可下载');
                return;
            }

            var csvContent = '\uFEFF错误详情\n';
            importErrors.forEach(function(err) {
                csvContent += err + '\n';
            });

            var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '场站信息_导入错误.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.parseFilePreview = parseFilePreview;
        window.closePreviewModal = closePreviewModal;
        window.confirmImportFromPreview = confirmImportFromPreview;
        window.deleteImportFile = deleteImportFile;
    </script>
</body>
</html>
