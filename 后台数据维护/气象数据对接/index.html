<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气象数据对接 - 新能源电力交易辅助决策系统</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="main-content">
        <div class="page-header">
            <h2 class="page-title">气象数据对接</h2>
            <p class="page-subtitle">统一管理气象数据源配置、连接状态及数据字段映射</p>
        </div>

        <div class="filter-bar">
            <div class="filter-item">
                <label>数据源类型</label>
                <select class="filter-select" style="width:130px" id="filter-type">
                    <option value="all">全部类型</option>
                    <option>气象局</option>
                    <option>卫星数据</option>
                    <option>数值预报</option>
                    <option>第三方API</option>
                </select>
            </div>
            <div class="filter-item">
                <label>连接状态</label>
                <select class="filter-select" style="width:120px" id="filter-status">
                    <option value="all">全部状态</option>
                    <option>已连接</option>
                    <option>连接异常</option>
                    <option>未连接</option>
                </select>
            </div>
            <div class="filter-item">
                <label>关键字</label>
                <input class="filter-input" placeholder="搜索数据源名称..." style="width:180px" id="filter-keyword">
            </div>
            <button class="btn-primary" onclick="filterSources()">查询</button>
            <div style="flex:1"></div>
            <button class="btn-secondary" onclick="testAllConnections()">测试全部连接</button>
            <button class="btn-primary" onclick="openSourceModal()">+ 新增数据源</button>
        </div>

        <div class="sync-info" style="display:flex;gap:var(--space-4);margin-bottom:var(--space-4)">
            <div class="sync-stat" style="text-align:center;padding:var(--space-3) var(--space-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);flex:1">
                <div class="num" style="font-size:var(--text-2xl);font-weight:700;color:var(--fg);line-height:1.2" id="total-sources">6</div>
                <div class="label" style="font-size:var(--text-xs);color:var(--muted)">数据源总数</div>
            </div>
            <div class="sync-stat" style="text-align:center;padding:var(--space-3) var(--space-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);flex:1">
                <div class="num" style="font-size:var(--text-2xl);font-weight:700;color:var(--success);line-height:1.2" id="connected-count">4</div>
                <div class="label" style="font-size:var(--text-xs);color:var(--muted)">已连接</div>
            </div>
            <div class="sync-stat" style="text-align:center;padding:var(--space-3) var(--space-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);flex:1">
                <div class="num" style="font-size:var(--text-2xl);font-weight:700;color:var(--danger);line-height:1.2" id="error-count">1</div>
                <div class="label" style="font-size:var(--text-xs);color:var(--muted)">连接异常</div>
            </div>
            <div class="sync-stat" style="text-align:center;padding:var(--space-3) var(--space-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);flex:1">
                <div class="num" style="font-size:var(--text-2xl);font-weight:700;color:var(--fg);line-height:1.2" id="last-sync">10:23</div>
                <div class="label" style="font-size:var(--text-xs);color:var(--muted)">最近同步</div>
            </div>
        </div>

        <div class="table-section" style="margin-top: var(--space-4)">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width:60px">#</th>
                        <th>数据源名称</th>
                        <th style="width:90px">类型</th>
                        <th style="width:80px">连接状态</th>
                        <th>服务地址</th>
                        <th style="width:180px">数据字段</th>
                        <th style="width:80px">更新频率</th>
                        <th style="width:80px">最近同步</th>
                        <th style="width:160px">操作</th>
                    </tr>
                </thead>
                <tbody id="source-table-body"></tbody>
            </table>
            <div class="pagination">
                <span class="info-text" id="source-count">共 0 条记录</span>
                <div><button class="page-btn active">1</button></div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="source-modal" style="display:none">
        <div class="modal-panel" style="width:560px">
            <div class="modal-header">
                <h3 id="source-modal-title">新增数据源</h3>
                <button class="modal-close" onclick="closeSourceModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">数据源名称 <span style="color:var(--danger)">*</span></label>
                        <input class="form-input" id="edit-name" placeholder="如：湖南省气象局">
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">数据源类型 <span style="color:var(--danger)">*</span></label>
                        <select class="form-input" id="edit-type">
                            <option>气象局</option>
                            <option>卫星数据</option>
                            <option>数值预报</option>
                            <option>第三方API</option>
                        </select>
                    </div>
                </div>
                <div class="form-section">
                    <label class="form-label">服务地址 <span style="color:var(--danger)">*</span></label>
                    <input class="form-input" id="edit-url" placeholder="http://... 或 https://...">
                </div>
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">认证方式</label>
                        <select class="form-input" id="edit-auth">
                            <option value="无">无</option>
                            <option value="API Key">API Key</option>
                            <option value="Token">Token</option>
                            <option value="Basic">Basic 认证</option>
                        </select>
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">认证凭据</label>
                        <input class="form-input" id="edit-cred" type="password" placeholder="API Key / Token">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-section" style="flex:1">
                        <label class="form-label">更新频率</label>
                        <select class="form-input" id="edit-interval">
                            <option value="10分钟">10分钟</option>
                            <option value="15分钟" selected>15分钟</option>
                            <option value="30分钟">30分钟</option>
                            <option value="1小时">1小时</option>
                            <option value="6小时">6小时</option>
                        </select>
                    </div>
                    <div class="form-section" style="flex:1">
                        <label class="form-label">数据格式</label>
                        <select class="form-input" id="edit-format">
                            <option value="JSON">JSON</option>
                            <option value="XML">XML</option>
                            <option value="CSV">CSV</option>
                            <option value="GRIB2">GRIB2</option>
                        </select>
                    </div>
                </div>
                <div class="form-section">
                    <label class="form-label">数据字段映射</label>
                    <textarea class="form-input" id="edit-fields" rows="3" placeholder='[{"name":"风速","key":"wind_speed","unit":"m/s"},{"name":"辐照度","key":"ghi","unit":"W/m²"}]' style="resize:vertical;min-height:72px;font-family:var(--font-mono);font-size:var(--text-xs)"></textarea>
                    <span class="field-help">JSON格式，定义数据源字段与系统字段的映射关系</span>
                </div>
                <div class="form-section">
                    <label class="form-label">备注说明</label>
                    <textarea class="form-input" id="edit-notes" rows="2" placeholder="数据源说明、接入时间等" style="resize:vertical;min-height:48px"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeSourceModal()">取消</button>
                <button class="btn-primary" onclick="saveSource()">保存</button>
            </div>
        </div>
    </div>

    <script>
        var sources = [
            { name:'湖南省气象局', type:'气象局', url:'http://hnweather.gov.cn/api/v2', auth:'API Key', cred:'hn***8a2', interval:'15分钟', format:'JSON', fields:'[{"name":"风速","key":"wind_speed","unit":"m/s"},{"name":"风向","key":"wind_dir","unit":"°"},{"name":"辐照度","key":"ghi","unit":"W/m²"},{"name":"温度","key":"temp","unit":"°C"},{"name":"湿度","key":"humidity","unit":"%"},{"name":"气压","key":"pressure","unit":"hPa"}]', status:'connected', lastSync:'10:23', notes:'湖南省气象局官方API，覆盖全省气象站点' },
            { name:'CMA 数值预报', type:'数值预报', url:'http://data.cma.cn/grid/gfs', auth:'Token', cred:'cm***4f', interval:'1小时', format:'GRIB2', fields:'[{"name":"风速","key":"wind","unit":"m/s"},{"name":"辐照度","key":"solar","unit":"W/m²"},{"name":"云量","key":"cloud","unit":"%"}]', status:'connected', lastSync:'09:45', notes:'国家气象中心数值预报产品' },
            { name:'ECMWF 全球模式', type:'数值预报', url:'https://api.ecmwf.int/v1/forecast', auth:'API Key', cred:'ec***9k', interval:'6小时', format:'GRIB2', fields:'[{"name":"风速","key":"wind","unit":"m/s"},{"name":"风向","key":"wind_dir","unit":"°"},{"name":"温度","key":"temp","unit":"°C"},{"name":"辐照度","key":"solar","unit":"W/m²"}]', status:'connected', lastSync:'08:00', notes:'ECMWF高精度全球气象模式' },
            { name:'葵花8号卫星云图', type:'卫星数据', url:'https://satellite.jma.go.jp/himawari/area', auth:'无', cred:'', interval:'10分钟', format:'JSON', fields:'[{"name":"云图","key":"image","unit":""},{"name":"云顶温度","key":"cld_temp","unit":"°C"}]', status:'connected', lastSync:'10:20', notes:'日本气象厅葵花8号卫星数据' },
            { name:'Solargis 辐照数据库', type:'第三方API', url:'https://api.solargis.com/v2/ghi', auth:'API Key', cred:'sg***1f', interval:'30分钟', format:'JSON', fields:'[{"name":"GHI","key":"ghi","unit":"W/m²"},{"name":"DNI","key":"dni","unit":"W/m²"},{"name":"DHI","key":"dhi","unit":"W/m²"}]', status:'error', lastSync:'06:12', notes:'欧洲太阳能辐照数据库，需订阅' },
            { name:'华北电力大学预测中心', type:'第三方API', url:'http://forecast.ncepu.edu.cn/api', auth:'Token', cred:'', interval:'15分钟', format:'JSON', fields:'[{"name":"风速","key":"wind","unit":"m/s"},{"name":"辐照度","key":"solar","unit":"W/m²"}]', status:'pending', lastSync:'-', notes:'华北电力大学新能源预测研究中心' }
        ];
        var editingIndex = -1;

        function renderTable(list) {
            var data = list || sources;
            var tbody = document.getElementById('source-table-body');
            tbody.innerHTML = '';
            data.forEach(function(s, i) {
                var fields = '';
                try {
                    var parsed = JSON.parse(s.fields);
                    fields = parsed.map(function(f) { return '<span class="field-tag" style="font-size:11px;padding:1px 7px;border-radius:var(--radius-pill);background:color-mix(in oklab,var(--accent),transparent 90%);color:var(--accent)">' + f.name + '</span>'; }).join('');
                } catch(e) { fields = '<span class="field-tag" style="font-size:11px;padding:1px 7px;border-radius:var(--radius-pill);background:color-mix(in oklab,var(--danger),transparent 88%);color:var(--danger)">解析失败</span>'; }

                var statusHtml = '';
                if (s.status === 'connected') statusHtml = '<span class="badge badge-success">已连接</span>';
                else if (s.status === 'error') statusHtml = '<span class="badge badge-danger">连接异常</span>';
                else statusHtml = '<span class="badge badge-muted">未连接</span>';

                var typeColors = { '气象局': 'var(--accent)', '卫星数据': 'var(--accent)', '数值预报': '#a16207', '第三方API': '#a16207' };
                var typeColor = typeColors[s.type] || 'var(--accent)';

                tbody.innerHTML += '<tr>' +
                    '<td style="color:var(--muted)">' + (i+1) + '</td>' +
                    '<td><strong>' + s.name + '</strong></td>' +
                    '<td><span style="font-size:var(--text-xs);padding:1px 8px;border-radius:var(--radius-pill);background:color-mix(in oklab,' + typeColor + ',transparent 88%);color:' + typeColor + '">' + s.type + '</span></td>' +
                    '<td>' + statusHtml + '</td>' +
                    '<td style="font-family:var(--font-mono);font-size:var(--text-xs);max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + s.url + '</td>' +
                    '<td><div style="display:flex;flex-wrap:wrap;gap:4px 8px">' + fields + '</div></td>' +
                    '<td>' + (s.interval || '-') + '</td>' +
                    '<td style="font-size:var(--text-xs);color:var(--muted)">' + s.lastSync + '</td>' +
                    '<td>' +
                    '<button class="btn-config" onclick="testConn(' + i + ')" style="padding:var(--space-1) var(--space-2);font-size:var(--text-xs)">测试</button> ' +
                    '<button class="btn-config" onclick="openSourceModal(' + i + ')" style="padding:var(--space-1) var(--space-2);font-size:var(--text-xs)">编辑</button> ' +
                    '<button class="btn-delete" onclick="deleteSource(' + i + ')" style="padding:var(--space-1) var(--space-2);font-size:var(--text-xs)">删除</button>' +
                    '</td></tr>';
            });
            document.getElementById('source-count').textContent = '共 ' + data.length + ' 条记录';
            updateStats(data);
        }

        function updateStats(data) {
            var total = data.length;
            var connected = data.filter(function(s) { return s.status === 'connected'; }).length;
            var errors = data.filter(function(s) { return s.status === 'error'; }).length;
            document.getElementById('total-sources').textContent = total;
            document.getElementById('connected-count').textContent = connected;
            document.getElementById('error-count').textContent = errors;
        }

        function openSourceModal(index) {
            var modal = document.getElementById('source-modal');
            if (index === undefined || index === null || index === -1) {
                editingIndex = -1;
                document.getElementById('source-modal-title').textContent = '新增数据源';
                ['edit-name','edit-url','edit-cred','edit-fields','edit-notes'].forEach(function(id) { document.getElementById(id).value = ''; });
                document.getElementById('edit-type').value = '气象局';
                document.getElementById('edit-auth').value = '无';
                document.getElementById('edit-interval').value = '15分钟';
                document.getElementById('edit-format').value = 'JSON';
            } else {
                editingIndex = index;
                document.getElementById('source-modal-title').textContent = '编辑数据源';
                var s = sources[index];
                document.getElementById('edit-name').value = s.name;
                document.getElementById('edit-type').value = s.type;
                document.getElementById('edit-url').value = s.url;
                document.getElementById('edit-auth').value = s.auth;
                document.getElementById('edit-cred').value = s.cred;
                document.getElementById('edit-interval').value = s.interval;
                document.getElementById('edit-format').value = s.format;
                document.getElementById('edit-fields').value = s.fields;
                document.getElementById('edit-notes').value = s.notes || '';
            }
            modal.style.display = 'flex';
        }

        function closeSourceModal() {
            document.getElementById('source-modal').style.display = 'none';
        }

        function saveSource() {
            var data = {
                name: document.getElementById('edit-name').value,
                type: document.getElementById('edit-type').value,
                url: document.getElementById('edit-url').value,
                auth: document.getElementById('edit-auth').value,
                cred: document.getElementById('edit-cred').value,
                interval: document.getElementById('edit-interval').value,
                format: document.getElementById('edit-format').value,
                fields: document.getElementById('edit-fields').value,
                notes: document.getElementById('edit-notes').value,
                status: 'connected',
                lastSync: '10:23'
            };
            if (!data.name) { alert('请输入数据源名称'); return; }
            if (!data.url) { alert('请输入服务地址'); return; }
            if (editingIndex >= 0) { sources[editingIndex] = data; } else { sources.push(data); }
            closeSourceModal();
            renderTable();
        }

        function deleteSource(index) {
            if (!confirm('确定删除数据源「' + sources[index].name + '」？')) return;
            sources.splice(index, 1);
            renderTable();
        }

        function testConn(index) {
            var s = sources[index];
            alert('正在测试连接: ' + s.url + '\n\n连接状态: ' + (s.status === 'connected' ? '✅ 连接成功 (' + s.lastSync + ')' : '❌ 连接失败，请检查接口配置'));
        }

        function testAllConnections() {
            var connected = sources.filter(function(s) { return s.status === 'connected'; }).length;
            var errors = sources.filter(function(s) { return s.status === 'error'; }).length;
            var pending = sources.filter(function(s) { return s.status === 'pending'; }).length;
            alert('正在测试全部数据源连接...\n\n已连接: ' + connected + '/' + sources.length + '\n异常: ' + errors + '\n未连接: ' + pending);
        }

        function filterSources() {
            var type = document.getElementById('filter-type').value;
            var status = document.getElementById('filter-status').value;
            var keyword = document.getElementById('filter-keyword').value;
            var filtered = sources.filter(function(s) {
                if (type !== 'all' && s.type !== type) return false;
                if (status !== 'all') {
                    if (status === '已连接' && s.status !== 'connected') return false;
                    if (status === '连接异常' && s.status !== 'error') return false;
                    if (status === '未连接' && s.status !== 'pending') return false;
                }
                if (keyword && !s.name.includes(keyword)) return false;
                return true;
            });
            renderTable(filtered);
        }

        var _modal = document.getElementById('source-modal');
        if (_modal) {
            _modal.addEventListener('click', function(e) { if (e.target === this) closeSourceModal(); });
        }

        renderTable();

        window.openSourceModal = openSourceModal;
        window.closeSourceModal = closeSourceModal;
        window.saveSource = saveSource;
        window.deleteSource = deleteSource;
        window.filterSources = filterSources;
        window.testConn = testConn;
        window.testAllConnections = testAllConnections;
    </script>
</body>
</html>
