<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电价预测 - 新能源电力交易辅助决策系统</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <main class="main-content">
        <!-- 页面标题 -->
        <div class="page-header">
            <h2 class="page-title">电价预测</h2>
            <p class="page-subtitle">短期及中长期电价预测分析</p>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar">
            <div class="filter-item">
                <label>查询日期</label>
                <input type="date" class="filter-input" id="query-date">
            </div>
            <button class="btn-primary" id="query-btn">查询</button>
        </div>

        <!-- 提示消息 -->
        <div id="toast-message" class="toast-message"></div>

        <!-- 结果区一：日前现货价格预测 -->
        <div class="result-section" id="section-combined">
            <h3 class="section-title" id="title-combined">日前现货价格预测（2026-04-21）</h3>
            <div class="chart-card">
                <div id="combined-chart" class="chart-container"></div>
            </div>
            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>时段(15分钟)</th>
                            <th>日前预测价(元/MWh)</th>
                            <th>置信区间(95%)</th>
                            <th>偏差率(%)</th>
                        </tr>
                    </thead>
                    <tbody id="combined-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- 结果区二：未来7天现货价格预测 -->
        <div class="result-section" id="section-week-forecast">
            <h3 class="section-title" id="title-week-forecast">未来 7 天现货价格预测（2026-06-29 起）单位：元/MWh</h3>
            <div class="chart-card">
                <div id="week-forecast-chart" class="chart-container"></div>
            </div>
            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>最高价(元/MWh)</th>
                            <th>最低价(元/MWh)</th>
                            <th>均价(元/MWh)</th>
                            <th>波动率(%)</th>
                        </tr>
                    </thead>
                    <tbody id="week-forecast-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- 结果区三：中长期电价预测 -->
        <div class="result-section" id="section-medium-long-term">
            <div class="section-header">
                <h3 class="section-title" id="title-medium-long-term">中长期电价预测（2026-06-29 起）单位：元/MWh</h3>
                <div class="section-filter">
                    <div class="filter-item">
                        <label>月份</label>
                        <select class="filter-select" id="month-select">
                            <option value="all">全部</option>
                            <option value="2026-06">2026年06月</option>
                            <option value="2026-07">2026年07月</option>
                            <option value="2026-08">2026年08月</option>
                            <option value="2026-09">2026年09月</option>
                            <option value="2026-10">2026年10月</option>
                            <option value="2026-11">2026年11月</option>
                            <option value="2026-12">2026年12月</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="chart-card">
                <div id="medium-long-term-chart" class="chart-container"></div>
            </div>
            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>月份</th>
                            <th>最高价(元/MWh)</th>
                            <th>最低价(元/MWh)</th>
                            <th>均价(元/MWh)</th>
                            <th>波动率(%)</th>
                        </tr>
                    </thead>
                    <tbody id="medium-long-term-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
