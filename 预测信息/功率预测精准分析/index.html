<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功率预测精度分析 - 新能源电力交易辅助决策系统</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 主内容区域 - 由主入口提供Header和Sidebar -->
    <main class="main-content">
        <!-- 页面标题 -->
        <div class="page-header">
            <h2 class="page-title">功率预测</h2>
            <p class="page-subtitle">功率预测精度统计与分析</p>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar">
            <div class="filter-item">
                <label>气象数据源</label>
                <select class="filter-select" id="data-source-select">
                    <option value="all">全部</option>
                    <option value="ecmwf">ECMWF</option>
                    <option value="gfs">GFS</option>
                    <option value="nam">NAM</option>
                    <option value="local">本地观测</option>
                </select>
            </div>
            <div class="filter-item">
                <label>开始时间</label>
                <input type="date" class="filter-input" value="2026-05-01">
            </div>
            <div class="filter-item">
                <label>结束时间</label>
                <input type="date" class="filter-input" value="2026-05-26">
            </div>
            <div class="filter-item">
                <label>预测精度</label>
                <select class="filter-select" id="precision-select">
                    <option value="15min" selected>15min</option>
                    <option value="1h">1h</option>
                    <option value="1d">1d</option>
                    <option value="3d">3d</option>
                    <option value="7d">7d</option>
                </select>
            </div>
            <button class="btn-primary" id="query-btn">查询</button>
            <button class="btn-secondary" id="export-btn">导出报表</button>
            <span class="query-status" id="query-status"></span>
        </div>

        <!-- 误差分析卡片 - 迁移至操作栏下方 -->
        <div class="error-metrics-section">
            <div class="error-metrics">
                <div class="error-metric">
                    <span class="metric-label">平均绝对误差 (MAE)</span>
                    <span class="metric-value" style="color: var(--accent)">0.24 <small>MW</small></span>
                </div>
                <div class="error-metric">
                    <span class="metric-label">均方根误差 (RMSE)</span>
                    <span class="metric-value" style="color: var(--danger)">0.31 <small>MW</small></span>
                </div>
                <div class="error-metric">
                    <span class="metric-label">均方根百分比误差 (MAPE)</span>
                    <span class="metric-value" style="color: var(--success)">5.82 <small>%</small></span>
                </div>
            </div>
        </div>

        <!-- 预测对比图表 - 合并为双Y轴图表 -->
        <div class="chart-card">
            <h3 class="chart-title">预测对比曲线</h3>
            <div id="power-comparison-chart" class="chart-container-large"></div>
        </div>

        <!-- 误差分布图 -->
        <div class="chart-card">
            <h3 class="chart-title">功率预测误差分析</h3>
            <div class="chart-toolbar">
                <span class="chart-badge">误差分布</span>
                <select class="filter-select error-filter-select" id="error-filter-select">
                    <option value="mae">平均绝对误差</option>
                    <option value="rmse">均方根误差</option>
                </select>
            </div>
            <div id="error-distribution-chart" class="chart-container-large"></div>
        </div>

        <!-- 底部图表容器 - 独立白色底色，不与操作栏联动 -->
        <div class="bottom-charts-container">
            <h3 class="section-title">功率预测准确率统计</h3>
            <div class="bottom-charts-row">
                <div class="chart-card">
                    <h3 class="chart-title">近7天功率预测准确率</h3>
                    <div id="accuracy-7days-chart" class="chart-container"></div>
                </div>
                <div class="chart-card">
                    <h3 class="chart-title">近30天功率预测准确率趋势</h3>
                    <div id="accuracy-30days-chart" class="chart-container"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
